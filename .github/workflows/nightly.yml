# .github/workflows/nightly.yml
name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"  # midnight UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  # The tests quarantined out of `dune runtest` (scheduler missed-wakeup
  # deadlock; Signal.watch dispatch race) run in NO other workflow, so nothing
  # would ever tell us the underlying races got fixed — they'd be effectively
  # deleted rather than quarantined. Run them here, nightly and
  # continue-on-error, purely as a signal: a green run is the cue to
  # un-quarantine (restore `(alias runtest)` in test/dune). Never blocks the
  # nightly release. See specs/todos/ for the open items.
  quarantined:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Run quarantined goldens (informational — expected to be flaky)
        timeout-minutes: 25
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          failed=""
          # Full alias paths, not bare names: build_check lives in
          # forge/test/dune, the rest in test/dune. Keep this list in sync
          # with the quarantine inventory in specs/todos/.
          for a in test/task_burst_await_quarantined \
                   test/signal_term_suppress_quarantined \
                   test/node_call_loopback_quarantined \
                   test/node_discovery_quarantined \
                   test/rpc_auto_enroll_quarantined \
                   forge/test/build_check_quarantined; do
            echo "::group::$a"
            if dune build "@$a"; then
              echo "$a: PASSED"
            else
              echo "$a: still failing"
              failed="$failed $a"
            fi
            echo "::endgroup::"
          done
          echo "still-failing:${failed:- none}"
          if [ -z "$failed" ]; then
            echo "::notice::All quarantined tests passed — consider un-quarantining them in test/dune."
          fi

  # Smoke-test the stdlib doc generator against the current compiler. The
  # external march_doc tool (auto-cloned by the script) is compiled by THIS
  # repo's compiler, so a language-rule change here can break it silently:
  # gen-stdlib-docs.yml only triggers on stdlib/** pushes, so the breakage
  # would otherwise surface weeks later on an unrelated stdlib change (this is
  # exactly how the strict main-capability-grant rule broke march_doc in
  # 2026-08). A red run here means march_doc needs updating for a compiler
  # change — fix it in the march_doc repo, not here.
  stdlib-docs-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Generate stdlib docs (march_doc compile + run smoke)
        run: |
          eval $(opam env)
          scripts/gen-stdlib-docs.sh

      - name: Check generated docs match committed pages
        run: |
          # A diff here means gen-stdlib-docs.yml didn't run (or its commit
          # didn't land) after the last stdlib change — the published site is
          # stale. Re-run that workflow (workflow_dispatch) to fix.
          git diff --exit-code --stat docs/docs/stdlib \
            || { echo "::error::committed docs/docs/stdlib is stale — dispatch the 'Regenerate Stdlib Docs' workflow"; exit 1; }

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        run: |
          # Extract base version from dune-project
          BASE=$(grep '(version' dune-project | head -1 | sed 's/.*version \(.*\))/\1/')
          DATE=$(date -u +%Y%m%d)
          echo "version=${BASE}-nightly.${DATE}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: main

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate nightly manifest
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          DATE="${{ needs.version.outputs.date }}"
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          REPO="https://github.com/march-language/march/releases/download"

          cat > nightly-manifest.json << MANIFEST
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "commit": "${COMMIT}",
            "assets": {
              "darwin-arm64": {
                "url": "${REPO}/nightly-${DATE}/march-${VERSION}-darwin-arm64.tar.gz",
                "sha256": "$(grep darwin-arm64 artifacts/march-${VERSION}-checksums.txt | cut -d' ' -f1)"
              },
              "linux-x86_64": {
                "url": "${REPO}/nightly-${DATE}/march-${VERSION}-linux-x86_64.tar.gz",
                "sha256": "$(grep linux-x86_64 artifacts/march-${VERSION}-checksums.txt | cut -d' ' -f1)"
              },
              "linux-aarch64": {
                "url": "${REPO}/nightly-${DATE}/march-${VERSION}-linux-aarch64.tar.gz",
                "sha256": "$(grep linux-aarch64 artifacts/march-${VERSION}-checksums.txt | cut -d' ' -f1)"
              }
            }
          }
          MANIFEST

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.version.outputs.date }}
          name: "Nightly ${{ needs.version.outputs.version }}"
          body: |
            Automated nightly build from `main` branch.

            **Version:** ${{ needs.version.outputs.version }}
            **Date:** ${{ needs.version.outputs.date }}

            Install with forge:
            ```
            forge toolchain install ${{ needs.version.outputs.version }}
            ```
          files: |
            artifacts/*
            nightly-manifest.json
            install.sh
          prerelease: true

      - name: Update rolling nightly tag
        run: |
          git tag -f nightly HEAD
          git push -f origin nightly

  prune:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Prune old nightlies
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const nightlies = releases
              .filter(r => r.tag_name.startsWith('nightly-') && r.tag_name !== 'nightly')
              .sort((a, b) => b.created_at.localeCompare(a.created_at));

            const toDelete = nightlies.slice(30);  // keep last 30
            for (const release of toDelete) {
              console.log(`Pruning ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                console.log(`Tag ${release.tag_name} already deleted`);
              }
            }

            console.log(`Pruned ${toDelete.length} old nightlies, kept ${Math.min(nightlies.length, 30)}`);
