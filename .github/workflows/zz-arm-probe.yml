# TEMPORARY — delete before merge. Dispatches build.yml against this branch so
# the linux-aarch64 leg can be verified without publishing a nightly release.
name: ARM probe
on:
  push:
    branches: [claude/relaxed-sutherland-4b908d]
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          echo "arch=$(uname -m) kernel=$(uname -r)"
          echo "runner arch env: $RUNNER_ARCH"
          docker version --format '{{.Server.Arch}}'
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: probe
      ref: ${{ github.sha }}
