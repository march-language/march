name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The search index is built from docs/ but by a script outside it; without this a
      # change to the indexer alone would never reach the live site.
      - 'scripts/build-search-index.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Generate .scrollmd notebook downloads
        run: python3 scripts/gen-scrollmd.py --emit --out docs/downloads

      - name: Build Jekyll site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "" --destination ../_site

      # Pin Node rather than relying on whatever the runner image happens to ship, so
      # `npx pagefind` can't start failing on an image bump.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pagefind crawls the BUILT site, so it must run after Jekyll and before deploy.
      # This is what makes one ⌘K search cover both the Jekyll pages and the 114
      # pre-generated stdlib API pages. The script fails the build if the index comes
      # out empty, so a dropped `data-pagefind-body` can't ship a dead search box.
      - name: Build search index (Pagefind)
        run: scripts/build-search-index.sh _site

      - name: Deploy built site to march-language.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: march-language/march-language.github.io
          publish_branch: main
          publish_dir: ./_site
          force_orphan: true
