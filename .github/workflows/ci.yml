# .github/workflows/ci.yml
#
# Job layout / why it looks like this
# ───────────────────────────────────
# This used to be one `build` matrix job running every check serially, which
# measured 29.7min end-to-end on ubuntu (Test 16.4min, ASAN gate 6.8min,
# types-check 2.4min, opam install 2.3min, rest small) — the whole workflow's
# critical path, and unfixable by caching alone since the steps were serial.
#
# Now every independent check is its own job, so the critical path is the
# single slowest one rather than their sum:
#
#   doc-lint                            (standalone, ~10s)
#   test          (ubuntu, macos)       `dune runtest`
#   conformance   (ubuntu, macos)       @types-check, @grammar-check, @vault-scale, docs, fmt
#   sanitize-gate (ubuntu)              ASAN gate: golden corpus + curated SIMD/NativeArray
#   ocaml-build   (ubuntu, macos) ─┬─ property-tests × 3 (per OS)
#                  ubuntu leg only ─┼─ cross-linux-oracle
#                                   └─ property-oracle × 8
#
# Two other changes cut the per-job floor and the per-compile cost:
#   - .github/actions/opam-deps caches ~/.opam, so `opam install --deps-only`
#     stops reinstalling all 46 packages (~2.3min) in every job;
#   - the compiler now caches compiled C-runtime objects
#     (lib/cas/runtime_archive.ml), so `march --compile` no longer rebuilds
#     the whole ~20-file runtime per invocation — which is most of what the
#     Test step and the ASAN gate were actually spending their time on.
#
# Every job carries timeout-minutes: a dune build/runtest can wedge on its RPC
# daemon (see CLAUDE.md/scripts/run-tests.sh), and before these were added a
# single wedged step silently ate the full 6h GitHub Actions job ceiling.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  doc-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint docs for stale source pointers and stdlib counts
        run: scripts/check-docs.sh

      # docs/pagefind/ is a COMMITTED build artifact — march-lang.org is served by
      # GitHub's own Jekyll over docs/, which has no post-build hook, so the search index
      # can only reach production by being in git. A docs edit without a regenerated
      # index means the live search silently serves stale results, which nothing else
      # would catch. Compares a digest of the docs sources, not the index bytes:
      # Pagefind's output is intentionally not reproducible run-to-run.
      - name: Check the committed search index is not stale
        run: scripts/gen-docs-search-index.sh --check

  # The long pole. Kept as its own job so nothing else waits behind it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # cross-tools: `dune runtest` includes a linux/amd64 TLS+gzip test that
      # shells out to `zig cc` against the fetched sysroot.
      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup
        with:
          cross-tools: "true"

      - name: Build
        timeout-minutes: 10
        run: |
          eval $(opam env)
          # Clear any stale daemon state before the first dune invocation of the
          # job (cheap defense-in-depth against the wedge noted at the top of
          # this file; likely a no-op on a fresh GH-hosted runner, but mirrors
          # scripts/run-tests.sh's MARCH_DUNE_SHUTDOWN).
          dune shutdown 2>/dev/null || true
          # Build the public exe directly (bin/main.exe = `march`), NOT `@install`
          # (which also builds forge/march-lsp — neither is referenced anywhere
          # else in this job) and NOT a bare `dune build`. A no-target `dune build`
          # intermittently wedges at ~0% CPU AFTER building everything — even the
          # narrower `@install` alias hit this once in CI (a `Build` step silently
          # ate the full 6h job ceiling). A single explicit exe target is the
          # narrowest safe scope; `dune runtest` below still builds+runs the full
          # test suite (incl. forge/lsp), so those compile errors are still
          # caught, just one step later.
          dune build bin/main.exe

      - name: Test
        timeout-minutes: 30
        run: |
          eval $(opam env)
          dune runtest

  # Static-semantics + grammar corpora, doc notebooks and formatting: all
  # independent of `dune runtest` and of each other, and all short — grouped
  # into one job rather than four so they don't each pay job-setup overhead.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Static-semantics conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build @types-check

      # Refinement checking reports a violation only when a predicate can NEVER
      # hold; every other outcome is silence. Silence therefore does not
      # distinguish "proved" from "the checker could not decide it" — an
      # ambiguity that let `{List(a) | len(_) > 0}` ship enforcing nothing while
      # the whole suite stayed green. `--refine-report` counts the obligations,
      # and this step ratchets the count so coverage cannot quietly regress.
      #
      # Lives in `conformance`, not beside `scripts/check-docs.sh` in `doc-lint`:
      # that job is a bare checkout with neither a built compiler nor z3 on PATH,
      # and this step needs both.
      - name: Refinement obligation coverage ratchet
        timeout-minutes: 5
        run: |
          set -euo pipefail
          eval $(opam env)
          # This ratchet is two INDEPENDENT bounds, read from two different
          # files, because no single file was a good source for both:
          #
          #   CEILING (skips must not rise) — read from the whole-program
          #   (`user + stdlib`) slice of stdlib/list.march. Measured
          #   2026-07-29: 8 proved, 0 violated, 28 skipped (unreflectable-
          #   predicate 1, solver-undecided 27).
          #
          #   RAISED 2026-08-06, 28 -> 34, deliberately. Adding a refinement
          #   to a stdlib function RAISES an obligation at every stdlib-
          #   internal call site of it, and the ones that are not guarded
          #   land as skips — so contracting more of the stdlib pushes this
          #   number UP even though the checker is strictly checking more.
          #   The proof-based `cap no_panic` branch contracted 13 new
          #   parameters across stdlib/stats.march and stdlib/random.march
          #   (Stats percentile/quantile/quantiles/five_number_summary/
          #   variance/mode/covariance/correlation/linear_regression,
          #   Random.choice_weighted). Attributed, not assumed: reverting
          #   ONLY those two files on the merged branch and re-measuring
          #   reproduces main's exact 15 proved / 24 skipped, so the whole
          #   +1 proved / +10 skipped delta is those contracts and nothing
          #   else regressed. Note the 24 here vs the 28 recorded above:
          #   main had already travelled down to 24 since 2026-07-29.
          #
          #   Lower is better — this bound
          #   may only ever be revised DOWN. This is the check that is
          #   actually sensitive to the pass checking less than it used to:
          #   if the walk still descends into the file but proves fewer of
          #   the obligations it raises, skips rises and this fires.
          #
          #   FLOOR (proved must not fall) — a ceiling alone is not a ratchet:
          #   if the walk stopped descending into a file ENTIRELY, it raises
          #   zero obligations there and reports 0 skipped, satisfying the
          #   ceiling trivially. stdlib/list.march cannot host this floor:
          #   its OWN (`user code`) slice is 0 proved / 0 violated / 5 skipped
          #   — every one of its 8 "proved" obligations comes from the
          #   prepended stdlib prelude, not from the file, so an empty file
          #   reports the same 8 and the floor would defend nothing. Instead
          #   read the `user code` slice of a small fixture that itself
          #   proves something: specs/lang/types/accept/t118_refine_length_
          #   guard_discharges.march, whose `user code` slice is 1 proved /
          #   0 violated / 0 skipped (measured 2026-07-29). Higher is better
          #   — this bound may only ever be revised UP.
          baseline=34
          proved_floor=1
          floor_fixture=specs/lang/types/accept/t118_refine_length_guard_discharges.march
          dune build bin/main.exe
          # A `--check` whose sources hash to an artifact already in the CAS
          # exits BEFORE parsing (bin/main.ml, the `do_check` lookup), so the
          # report never runs and the command prints nothing while exiting 0.
          # `--refine-report` is not part of the cache key, so a plain `--check`
          # from an earlier step (or from the other measurement below) is
          # enough to poison the next one. Clear the check artifacts before
          # EACH measurement so both are always real. NOTE this is
          # artifacts-v2, not `.march/cas/vc` — vc holds solver verdicts and has
          # no bearing on whether the report prints.

          rm -rf .march/cas/artifacts-v2
          ./_build/default/bin/main.exe --check --refine-report "$floor_fixture" \
            > /tmp/refine_floor.txt 2>&1 || true
          cat /tmp/refine_floor.txt
          # Read the file's OWN (`user code`) slice specifically. `--refine-
          # report` prints two labelled lines (user code, and user + stdlib,
          # because the driver prepends the entire standard library); a bare
          # `grep -o '[0-9]* proved'` would match both and silently read the
          # wrong one.
          proved=$(sed -n \
            's/^refinement obligations (user code): \([0-9][0-9]*\) proved,.*/\1/p' \
            /tmp/refine_floor.txt)
          if [ -z "$proved" ]; then
            echo "FAIL: could not find the 'user code' line in --refine-report output"
            echo "for $floor_fixture."
            echo "Three things produce that, in order of likelihood:"
            echo "  a. the run hit the --check CAS and short-circuited before the"
            echo "     report — clear .march/cas/artifacts-v2 (the rm above should"
            echo "     already do this; check it did not get dropped);"
            echo "  b. the compiler errored before printing;"
            echo "  c. the report's format changed — update the sed above."
            echo "This step must never pass vacuously."
            exit 1
          fi
          echo "proved=$proved (floor: $proved_floor), read from $floor_fixture's user code slice"
          if [ "$proved" -lt "$proved_floor" ]; then
            echo ""
            echo "FAIL: refinement obligations PROVED fell from $proved_floor to $proved"
            echo "on $floor_fixture's own (user code) slice."
            echo "The ceiling on skips (measured on a different file, below) cannot"
            echo "catch this: a pass that stopped descending into a file entirely"
            echo "reports 0 skipped there too and would sail through it."
            echo "Fewer proofs means contracts that were enforced no longer are."
            echo ""
            echo "The most common cause is a measure alias being withdrawn too"
            echo "eagerly — the gates in lib/refinecheck/refine_check.ml"
            echo "(stdlib_member_defs_ok / bare_builtin_undefined) suppress on"
            echo "doubt, so widening one can switch the feature off wholesale."
            echo "Check the per-reason breakdown printed above: proofs turning"
            echo "into 'solver-undecided' skips is that signature."
            exit 1
          fi

          rm -rf .march/cas/artifacts-v2
          ./_build/default/bin/main.exe --check --refine-report stdlib/list.march \
            > /tmp/refine_ceiling.txt 2>&1 || true
          cat /tmp/refine_ceiling.txt
          # Read the whole-program slice specifically, same reasoning as above.
          skipped=$(sed -n \
            's/^refinement obligations (user + stdlib):.*, \([0-9][0-9]*\) skipped$/\1/p' \
            /tmp/refine_ceiling.txt)
          if [ -z "$skipped" ]; then
            echo "FAIL: could not find the 'user + stdlib' line in --refine-report output"
            echo "for stdlib/list.march."
            echo "Three things produce that, in order of likelihood:"
            echo "  a. the run hit the --check CAS and short-circuited before the"
            echo "     report — clear .march/cas/artifacts-v2 (the rm above should"
            echo "     already do this; check it did not get dropped);"
            echo "  b. the compiler errored before printing;"
            echo "  c. the report's format changed — update the sed above."
            echo "This step must never pass vacuously."
            exit 1
          fi
          echo "skipped=$skipped (ceiling: $baseline), read from stdlib/list.march's user + stdlib slice"
          if [ "$skipped" -gt "$baseline" ]; then
            echo ""
            echo "FAIL: refinement obligation skips rose from $baseline to $skipped."
            echo "A RISE IN SKIPS MEANS FEWER OBLIGATIONS ARE BEING CHECKED — contracts"
            echo "that used to be proved are now silently unenforced. This is a"
            echo "regression even though nothing errored, because March's default"
            echo "stance turns an undischarged obligation into silence."
            echo ""
            echo "What to do:"
            echo "  1. Run it locally, against a COLD CHECK CACHE:"
            echo "       rm -rf .march/cas/artifacts-v2"
            echo "       ./_build/default/bin/main.exe --check \\"
            echo "         --refine-report stdlib/list.march"
            echo "     Without that rm, a cached --check exits before the report runs"
            echo "     and you get empty output, not a smaller number. Add"
            echo "     'rm -rf .march/cas/vc' as well only if you want z3 to re-decide"
            echo "     from scratch — that is a separate cache and does not affect"
            echo "     whether the report prints at all."
            echo "  2. Diff the per-reason breakdown against the baseline above. A jump"
            echo "     in 'solver-undecided' usually means a measure alias was withdrawn"
            echo "     or a guard stopped reflecting; 'unreflectable-predicate' means a"
            echo "     contract was rewritten outside the supported fragment."
            echo "  3. A missing z3 does NOT show up as skips falling — it shows up as"
            echo "     skips RISING. Without a solver every obligation is Unverified,"
            echo "     so the measured signature is 0 proved / 36 skipped (every one of"
            echo "     the 8 proofs becomes a skip). If you see that pair, check the"
            echo "     toolchain step before blaming the code."
            echo "  4. Fix the regression. Only raise the ceiling if the rise is"
            echo "     intentional and explained in the commit message; this number is"
            echo "     meant to travel downward."
            exit 1
          fi

      # --refine-audit (lib/refinecheck/refine_audit.ml) answers a different
      # question than the ratchet above: not "did a filed obligation stop
      # being proved" but "does the checker ever look at this declared
      # refinement at all". Task 2/3's sweep over the ~300-file corpus
      # (test/native/*.march, stdlib/*.march) found 63 declared refinements,
      # every one Enforced, zero Unenforced — see test/refine_audit/
      # corpus.baseline (the alcotest `audit-baseline` group under
      # `dune runtest`, which the `test` job above already runs, diffs the
      # full sweep against that file exactly). This step is a second,
      # narrower ratchet in this job specifically: it reads the SAME
      # `user + stdlib` slice the ceiling step above uses (stdlib/list.march
      # sees the whole prepended stdlib regardless of which stdlib file is
      # named, per that comment), and fails if its Unenforced count rises
      # above what the corpus baseline currently records. A rise here means
      # a newly declared refinement landed in a position the checker never
      # enforces (a lambda param, a block-level fn, a non-adoptable impl
      # method, an actor field/handler param, ...) with nothing else in CI
      # catching it, because an Unenforced site files no obligation and so
      # never touches the ratchet above at all.
      - name: Refinement coverage audit ratchet
        timeout-minutes: 5
        run: |
          set -euo pipefail
          eval $(opam env)
          unenforced_baseline=0
          rm -rf .march/cas/artifacts-v2
          ./_build/default/bin/main.exe --check --refine-audit stdlib/list.march \
            > /tmp/refine_audit_ceiling.txt 2>&1 || true
          cat /tmp/refine_audit_ceiling.txt
          unenforced=$(sed -n \
            's/^coverage audit (user + stdlib): [0-9][0-9]* enforced, [0-9][0-9]* inert (warned), \([0-9][0-9]*\) unenforced$/\1/p' \
            /tmp/refine_audit_ceiling.txt)
          if [ -z "$unenforced" ]; then
            echo "FAIL: could not find the 'coverage audit (user + stdlib)' line in"
            echo "--refine-audit output for stdlib/list.march."
            echo "Likely causes: a warm --check CAS short-circuited before the audit"
            echo "printed (the rm above should prevent this), the compiler errored"
            echo "before printing, or the audit's summary line format changed (update"
            echo "the sed above to match). This step must never pass vacuously."
            exit 1
          fi
          echo "unenforced=$unenforced (ceiling: $unenforced_baseline), read from stdlib/list.march's user + stdlib slice"
          if [ "$unenforced" -gt "$unenforced_baseline" ]; then
            echo ""
            echo "FAIL: the refinement coverage audit's Unenforced count rose from"
            echo "$unenforced_baseline to $unenforced."
            echo "A declared refinement now sits somewhere the checker never enforces"
            echo "it — see test/refine_audit/corpus.baseline and"
            echo "docs/refinement-types.md's 'Coverage audit' section for the full"
            echo "list of unenforced positions (a lambda's own param, a block-level"
            echo "fn's param/return, a non-adoptable impl method's param, an actor's"
            echo "state field or handler param, a nested refinement, a String"
            echo "return, ...)."
            echo ""
            echo "What to do:"
            echo "  1. Reproduce locally:"
            echo "       rm -rf .march/cas/artifacts-v2"
            echo "       ./_build/default/bin/main.exe --check --refine-audit stdlib/list.march"
            echo "  2. Read the per-site lines this prints (file:line:col, the"
            echo "     predicate, and why it is Unenforced) to find what changed."
            echo "  3. Fix the regression, or move the new refinement to a position"
            echo "     the checker enforces (a top-level fn's own parameter, its"
            echo "     return when the base is Int/Bool/Float/a registered record, or"
            echo "     a let-binding)."
            echo "  4. Only raise this ceiling if the rise is intentional and filed as"
            echo "     a specs/todos/ entry with a reproducer, exactly like the four"
            echo "     Task 4 todos this ratchet was introduced alongside."
            exit 1
          fi

      - name: Resolved-grammar conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @grammar-check

      # Vault's striped reader-count lock (runtime/march_extras.c,
      # vault_rwlock_t): T = min(4, ncores) threads reading DISTINCT keys
      # should scale close to 1x wall-clock (measured ~2.0x median at T=4 on
      # a loaded 14-core dev box; see test/test_vault_distinct_keys_scale.c's
      # header for the full history). The test reads sysconf's online core
      # count at runtime and adapts both its thread count and its bound
      # (solo_median * (T * 0.9)) to it — hosted runners here have only 2-4
      # cores, and a hard-coded 4-thread shape can't show speedup on that
      # regardless of lock quality, so this is NOT a claim that these
      # runners are "quiet" (that reasoning was wrong; the constraint is
      # core count, not load). Still NOT part of `runtest` — it is a
      # parallel-scaling benchmark, not a unit test. Same "own alias, run
      # explicitly" shape as @types-check / @grammar-check above.
      - name: Vault distinct-key read-scaling benchmark (not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @vault-scale

      - name: Check doc notebooks (.scrollmd) compile
        timeout-minutes: 5
        run: |
          eval $(opam env)
          MARCH_BIN="dune exec march --" python3 scripts/gen-scrollmd.py --check

      # Runs the JIT REPL and validates every stdlib `march>` example against the
      # value it renders. A HARD gate on Linux, where it is deterministic and
      # clean. Scoped OFF macOS: the JIT's core cross-dylib string miscompile is
      # now FIXED (repl_jit.ml two-level runtime link, see
      # specs/progress/2026-08-09-jit-macos-cross-dylib-string-miscompile.md), but
      # the GitHub macos-15 runner has a RESIDUAL nondeterminism even with the fix
      # (first runtime .so built in a job can still miscompile) that needs a
      # macOS 15 host to root-cause. Re-enable on macOS once that residual is gone.
      - name: Check stdlib `march>` doctests
        if: runner.os != 'macOS'
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build bin/main.exe
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            python3 scripts/check-stdlib-doctests.py --check

      - name: Check formatting
        timeout-minutes: 3
        run: |
          eval $(opam env)
          dune fmt 2>&1 || true

  # AddressSanitizer sweep, run TWICE on this runner (plain, then MARCH_TRMC=1).
  # sanitize.sh covers two corpora: every specs/lang/golden/*.march, plus a
  # curated by-name list of test/native/*.march SIMD / NativeArray-narrow-width /
  # array-backed-Bytes programs — that second corpus was added 2026-08-20 because
  # no sanitizer had ever compiled that code (the golden corpus contains zero
  # SIMD/NativeArray programs). See the script header for why the curated list is
  # a list and not a glob, and why those programs are not simply new goldens.
  #
  # Ubuntu-only: the gate no-ops on a Mac running CrowdStrike Falcon, whose
  # syscall interception hangs ASAN's shadow-memory setup.
  sanitize-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: AddressSanitizer gate (RC/UAF guard) — golden + curated SIMD/NativeArray
        timeout-minutes: 15
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            ./specs/lang/golden/sanitize.sh

      - name: AddressSanitizer gate — TRMC enabled
        timeout-minutes: 15
        run: |
          eval $(opam env)
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            MARCH_TRMC=1 ./specs/lang/golden/sanitize.sh

  # Runs the full test suite with MARCH_TRMC=1 on its own fresh runner. It used to be
  # a third phase inside sanitize-gate, but that confounded resource exhaustion (two
  # ASAN sweeps already run on that runner) with the TRMC variable itself — failures
  # were flaky/non-reproducible. A clean runner isolates whether TRMC is the cause.
  trmc-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      # This job was split out of sanitize-gate (see comment above), where the
      # build was implicit — inherited from an earlier step in that job. Standalone,
      # nothing builds the compiler first, so it needs its own Build step.
      - name: Build
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe

      - name: Test suite with TRMC enabled
        timeout-minutes: 35
        # Cold build + full test suite (~20 min of tests) with TRMC enabled.
        run: |
          eval $(opam env)
          MARCH_TRMC=1 ./scripts/run-tests.sh

  # Build once, fan out via same-run artifacts (not a persistent actions/cache):
  # cross-linux-oracle and all 8 property-oracle shards below each used to
  # independently pay ~2.3min opam-install + a fresh `dune build` — 9 job
  # instances redoing identical work. Neither of them needs a coherent local
  # `_build`/incremental dune state the way the `dune runtest`-based test job
  # does (they just RUN a prebuilt exe), so a single upstream build here is
  # safe to fan out as plain files rather than a dune-mediated cache —
  # deliberately NOT `actions/cache` on `~/.cache/dune` for this: this project
  # already hit a dune shared-cache-poisoning incident (a stale artifact from
  # a differently-flagged/differently-versioned compiler silently re-served
  # across worktrees), and a run-scoped artifact can't leak across runs by
  # construction, which a persistent cache key can't guarantee no matter how
  # carefully the key is chosen.
  # Matrixed over both runners because `property-tests` below consumes this,
  # and its groups must run on macOS too (see that job's comment). The Linux
  # leg additionally feeds cross-linux-oracle and the 8 property-oracle shards.
  ocaml-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Build compiler + oracle binaries
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe test/test_oracle.exe test/test_properties.exe

      - name: Upload built exes
        uses: actions/upload-artifact@v4
        with:
          name: ocaml-build-exes-${{ matrix.os }}-${{ github.run_id }}
          retention-days: 1
          path: |
            _build/default/bin/main.exe
            _build/default/test/test_oracle.exe
            _build/default/test/test_properties.exe

  # Cross-compilation gate (P1): cross-compile the deterministic examples+golden
  # corpus to Linux via `zig cc` and assert byte-identical output to the native
  # build (native-referenced).  Targets linux/amd64 so the cross binaries run
  # NATIVELY on the x86_64 runner (no QEMU) — QEMU user-mode emulation produces
  # spurious segfaults that the oracle would count as failures.  arm64 coverage
  # needs a native arm64 runner (ubuntu-24.04-arm) — a follow-up.  This still
  # exercises the whole LinuxGnu / zig-cc / arch-flag / external-lib-stripping
  # path end to end.
  cross-linux-oracle:
    runs-on: ubuntu-24.04
    needs: [ocaml-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No OCaml/opam/dune here at all: this job only RUNS a prebuilt exe from
      # ocaml-build (a standalone native binary needs no OCaml toolchain to
      # execute) — only the system deps below (needed for the dynamic linker
      # to resolve libblake3.so at process start) and zig (needed because
      # test_oracle.exe's own MARCH_ORACLE_CROSS logic shells out to `zig cc`
      # for the cross-compile) are actually required at runtime.
      - name: Install system dependencies (blake3 for the native reference build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      - name: Install zig (the C cross-compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # path: _build/default, NOT `.` — upload-artifact@v4 strips the uploaded
      # paths' least common ancestor, which for the three exes is
      # `_build/default`, so the artifact's own entries are `bin/main.exe` and
      # `test/*.exe`. Downloading to `.` therefore lands them at ./bin/... and
      # every reference below (which uses the in-repo _build path, as the
      # exes' own runtime-dir lookup expects) misses.
      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          # ubuntu leg specifically: this job is Linux-only.
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/bin/main.exe _build/default/test/test_oracle.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              echo "Artifact layout actually downloaded:"; find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      - name: Cross oracle (linux/amd64, native-referenced, runs natively on the x86_64 runner)
        timeout-minutes: 20
        run: |
          MARCH_ORACLE_CROSS=amd64 \
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
          MARCH_ROOT="$PWD" \
          ./_build/default/test/test_oracle.exe

  # Differential-oracle CI (test/test_properties.ml's "oracle: interp = compiled"
  # group, ~1090 QCheck-generated compile-vs-interpret comparisons). This is NOT
  # wired into `dune runtest`'s Test step above: MARCH_BIN isn't set there, so
  # all 1090 checks silently skip (confirmed identical across every historical
  # CI run — "no-march-binary", 0 matched). Wiring MARCH_BIN into that step
  # directly isn't viable either: each unique generated program is a real
  # `--compile` that the whole-binary CAS can never hit (distinct sources), so
  # all 1090 would add well over an hour to the Test job on every push.
  # Instead this runs as its own job, sharded 8-way via alcotest's own
  # case-number filtering (`test <suite> <cases>`), hand-balanced by measured
  # per-case cost (not a naive index range) so no single shard is dominated by
  # the two heavier cases (case 0 = println_arith at QCheck count 100; case 20
  # = opt_matrix at count 20 * 2 opt levels).
  # test_properties.exe's QCheck property groups — everything in that binary
  # EXCEPT the interp-vs-compiled oracle group (which property-oracle below
  # runs, sharded, with MARCH_BIN set).
  #
  # Why this is its own job: measured on CI, this binary was 652s of the Test
  # step's 756s — the single dominant cost of `dune runtest` and of the whole
  # workflow's critical path. alcotest has no parallelism of any kind (no
  # --jobs/--parallel; cases run sequentially in-process), so the only lever is
  # running several filtered processes concurrently. test/dune therefore takes
  # it out of the `runtest` alias and this job runs it instead.
  #
  # Selection is by group-name REGEX, which has two sharp edges worth knowing:
  #   - alcotest's filter is a regex, so `+` and `(` in group names must be
  #     escaped — an unescaped name silently matches NOTHING and the shard
  #     "passes" in ~0s having run nothing. The coverage guard below exists
  #     precisely because that failure mode is invisible.
  #   - the oracle group must NOT be matched here. It is excluded by omission,
  #     so a new group added upstream would also be silently skipped — hence
  #     the guard asserting every listed group is covered by some shard.
  # Matrixed over BOTH runners, not just Linux. Before this job existed these
  # groups ran under `dune runtest`, which the `test` job runs on macOS and
  # Linux alike — making this Linux-only would have silently dropped every
  # QCheck property from macOS. That matters concretely: `classify_compile`
  # asserts how the compiler classifies signal deaths and segfault return
  # codes, precisely the macOS-vs-Linux divergent surface (test_properties.ml
  # already carries a macOS-only Sys_error special case), so a macOS-only
  # regression there would ship unseen.
  property-tests:
    runs-on: ${{ matrix.os }}
    needs: [ocaml-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `shard` must be a real matrix dimension, NOT just `include` entries:
        # with only `os` listed here, each `include` object would be merged
        # into every os combination and later objects would overwrite earlier
        # ones' `shard`/`filter` rather than producing the os × shard product
        # — silently running a subset. Listing both dimensions makes this a
        # true 2 × 3 = 6, with `include` only attaching each shard's filter.
        os: [ubuntu-24.04, macos-15]
        shard: [soundness, tir, rest]
        include:
          # `type soundness + eval` is isolated: it evaluates generated
          # programs against the full stdlib and measured far slower than
          # every other group combined, with high QCheck-seed variance.
          - shard: soundness
            filter: 'type soundness'
          - shard: tir
            filter: 'tir pipeline|tir passes|tir pass invariants'
          - shard: rest
            filter: 'algebraic oracle|semantic properties|parse\+typecheck|classify_compile|record-update converged|cli: timings'
    steps:
      - uses: actions/checkout@v4

      # Only the C libraries the prebuilt exe dynamically links — no OCaml or
      # opam here, since this job only RUNS a binary built upstream.
      - name: Install system dependencies (blake3 for the native build)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install blake3 brotli zstd llvm
          else
            sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
            git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
            cd /tmp/blake3/c
            gcc -O2 -shared -fPIC -o libblake3.so \
              blake3.c blake3_dispatch.c blake3_portable.c \
              blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
              blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
            sudo cp libblake3.so /usr/local/lib/libblake3.so
            sudo cp blake3.h /usr/local/include/blake3.h
            sudo ldconfig
          fi

      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          name: ocaml-build-exes-${{ matrix.os }}-${{ github.run_id }}
          path: _build/default
      # main.exe too, not just the test binary: two of the "(unit)" groups in
      # the `rest` shard (record-update converged, cli: timings) shell out to
      # the compiler. They locate it themselves via _build/default/bin/main.exe
      # relative to cwd, so with the artifact unpacked here they FIND it and
      # try to run it — a non-executable one fails with rc=126 rather than
      # being skipped as "no march binary". (Under `dune runtest` these skip,
      # because the test's cwd is _build/default/test where that path doesn't
      # resolve; running them here is a small coverage gain.)
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/test/test_properties.exe _build/default/bin/main.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      # Record exactly which property groups THIS shard's filter matches, for
      # the `property-coverage` job below to union and compare against the full
      # group list. This replaces a hand-maintained `COVERED` string that
      # duplicated the shard filters: that copy caught a NEWLY ADDED group (its
      # original purpose) but NOT an UNWIRED one — deleting a group from a shard
      # filter while leaving `COVERED` alone kept the guard green while the group
      # silently stopped running. Deriving coverage from the shards' own filters
      # closes that gap with a single source of truth (the matrix filters).
      - name: Record groups this shard covers
        run: |
          set -euo pipefail
          B=_build/default/test/test_properties.exe
          # `list` prints "<group> <case-index> <description>"; keep the group.
          $B list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/[[:space:]]+[0-9]+[[:space:]]+.*$//' | sed -E 's/[[:space:]]+$//' \
            | grep -v '^$' | grep -v 'qcheck random seed' | sort -u \
            | grep -E '${{ matrix.filter }}' > "covered-${{ matrix.shard }}.txt"
          echo "shard '${{ matrix.shard }}' covers:"; cat "covered-${{ matrix.shard }}.txt"

      # One artifact per (os, shard). Only ubuntu's are consumed downstream (the
      # group list is OS-independent), but uploading both keeps the step uniform.
      - name: Upload this shard's covered-groups report
        uses: actions/upload-artifact@v4
        with:
          name: covered-groups-${{ matrix.os }}-${{ matrix.shard }}
          path: covered-${{ matrix.shard }}.txt
          if-no-files-found: error

      - name: Property tests (shard ${{ matrix.shard }})
        timeout-minutes: 25
        run: |
          set -o pipefail
          # No MARCH_BIN: the oracle group is property-oracle's job. (The exe
          # would otherwise find _build/default/bin/main.exe on its own and
          # start compiling — the filters below keep it out of these shards.)
          _build/default/test/test_properties.exe test '${{ matrix.filter }}' -e 2>&1 | tee /tmp/shard.log
          ran=$(grep -cE '\[(OK|FAIL)\]' /tmp/shard.log || true)
          echo "cases actually run: $ran"
          if [ "$ran" -eq 0 ]; then
            echo "::error::shard '${{ matrix.shard }}' ran 0 cases — its filter regex matched nothing (unescaped + or ( in a group name?)"
            exit 1
          fi

  property-oracle:
    runs-on: ubuntu-24.04
    needs: [ocaml-build]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # 8-way (not 4-way): the first version of this job was sized against
        # local timing (~4s/compile on a 14-core Apple Silicon dev machine)
        # and failed on real GH Actions hardware, which measured ~6.5s/compile
        # (case 0 alone: 100 iterations in 10m48s) — shard 1 (250 cases) needed
        # ~27min against a 25min timeout. Re-balanced by measured cost. The
        # runtime-object cache has since cut the per-compile cost roughly in
        # half again; the shard split is left as-is rather than re-tuned
        # optimistically, per the same lesson.
        include:
          - shard: 1
            cases: "0,20"
          - shard: 2
            cases: "1,2,3"
          - shard: 3
            cases: "4,5,6"
          - shard: 4
            cases: "7,8,9"
          - shard: 5
            cases: "10,11,12"
          - shard: 6
            cases: "13,14,15"
          - shard: 7
            cases: "16,17"
          - shard: 8
            cases: "18,19"
    steps:
      - uses: actions/checkout@v4

      # No OCaml/opam/dune here at all — see cross-linux-oracle's comment
      # above for why; only the system deps below (dynamic-linker + the
      # generated-program-link needs of the `march --compile` subprocesses
      # this binary spawns) are actually required at runtime.
      - name: Install system dependencies (blake3 for the native build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      # path: _build/default, NOT `.` — upload-artifact@v4 strips the uploaded
      # paths' least common ancestor, which for the three exes is
      # `_build/default`, so the artifact's own entries are `bin/main.exe` and
      # `test/*.exe`. Downloading to `.` therefore lands them at ./bin/... and
      # every reference below (which uses the in-repo _build path, as the
      # exes' own runtime-dir lookup expects) misses.
      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          # ubuntu leg specifically: this job is Linux-only.
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/bin/main.exe _build/default/test/test_properties.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              echo "Artifact layout actually downloaded:"; find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      # The shards select oracle cases by INDEX, and alcotest silently ignores
      # an out-of-range index (`test <group> 0,99` runs case 0 and exits 0).
      # So adding a 22nd oracle property would run it in NO shard, and CI would
      # stay green; deleting one would shift every later index and silently
      # re-cover the wrong cases. The property-tests coverage guard cannot
      # catch either — it checks group NAMES, and this group is named there.
      # Pin the count instead: the 8 shards' index lists union to exactly
      # 0..20, so any change to the case count must come with a re-shard here.
      - name: Guard — oracle case count still matches the shard split
        run: |
          set -euo pipefail
          expected=21
          actual=$(./_build/default/test/test_properties.exe list 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -c '^oracle: interp = compiled' || true)
          echo "oracle cases: expected $expected, found $actual"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::the 'oracle: interp = compiled' group has $actual cases but the 8 property-oracle shards cover exactly $expected (indices 0..$((expected-1))). Re-balance the shard 'cases' lists in this workflow and update this guard, or the new/removed cases will silently run in no shard at all."
            exit 1
          fi

      - name: Differential oracle (shard ${{ matrix.shard }}/8, cases ${{ matrix.cases }})
        timeout-minutes: 25
        run: |
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            ./_build/default/test/test_properties.exe test 'oracle: interp = compiled' "${{ matrix.cases }}" -e

  # Asserts that every property group in test_properties.exe is actually run by
  # SOME property-tests shard (or is the oracle group, which property-oracle
  # owns). The truth comes from the shards' own recorded coverage (the
  # `covered-groups-*` artifacts each shard uploads), NOT a second hand-kept
  # copy of the filters — so a group dropped from a shard filter reddens here
  # instead of silently going unrun. Fail-closed: a missing artifact or an
  # unreadable list fails the job rather than passing vacuously.
  property-coverage:
    runs-on: ubuntu-24.04
    needs: [ocaml-build, property-tests]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bit
        run: |
          set -e
          test -f _build/default/test/test_properties.exe \
            || { echo "::error::test_properties.exe missing from the ocaml-build artifact"; exit 1; }
          chmod +x _build/default/test/test_properties.exe

      - name: Download every shard's covered-groups report
        uses: actions/download-artifact@v4
        with:
          pattern: covered-groups-ubuntu-24.04-*
          path: covered
          merge-multiple: true

      - name: Assert the shards' union covers every property group
        run: |
          set -euo pipefail
          B=_build/default/test/test_properties.exe
          $B list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/[[:space:]]+[0-9]+[[:space:]]+.*$//' | sed -E 's/[[:space:]]+$//' \
            | grep -v '^$' | grep -v 'qcheck random seed' | sort -u > all.txt
          shards=$(find covered -name '*.txt' | wc -l | tr -d ' ')
          if [ "$shards" -eq 0 ]; then
            echo "::error::no covered-groups-* artifacts were downloaded — the property-tests shards did not report their coverage."
            exit 1
          fi
          # The oracle group is deliberately run by property-oracle, not the shards.
          { echo 'oracle: interp = compiled'; cat covered/*.txt; } | sort -u > union.txt
          echo "--- all property groups ---"; cat all.txt
          echo "--- covered (union of $shards shard reports + oracle) ---"; cat union.txt
          missing=$(comm -23 all.txt union.txt)
          if [ -n "$missing" ]; then
            echo "::error::these property groups run in NO property-tests shard and are not the oracle group — a shard filter no longer matches them:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all $(wc -l < all.txt) property groups are covered by a shard or the oracle."
