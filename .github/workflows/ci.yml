# .github/workflows/ci.yml
#
# Job layout / why it looks like this
# ───────────────────────────────────
# This used to be one `build` matrix job running every check serially, which
# measured 29.7min end-to-end on ubuntu (Test 16.4min, ASAN gate 6.8min,
# types-check 2.4min, opam install 2.3min, rest small) — the whole workflow's
# critical path, and unfixable by caching alone since the steps were serial.
#
# Now every independent check is its own job, so the critical path is the
# single slowest one rather than their sum:
#
#   (doc-lint lives in doc-lint.yml so it runs on Markdown-only changes too)
#   test          (ubuntu) × 4          `dune runtest`, sharded: codegen, refinecheck,
#                                       compiler, rest (see the job's comment)
#                 (macos)               `dune runtest`, unsharded
#   macos-checks  (macos)               property groups (all but the oracle) + @vault-scale
#   two-node      (ubuntu) × 3          two-node scenarios, sharded 1/3, 2/3, 3/3;
#                                       shard 1 also runs the node_discovery soak
#   conformance   (ubuntu)              @types-check, @grammar-check, @vault-scale, docs
#   tree-sitter   (ubuntu)              tree-sitter-march/ parses what the compiler accepts
#   sanitize-gate (ubuntu) × 3          ASAN: golden + curated native (shard 1) + two-node 1/3..3/3
#   ocaml-build   (ubuntu) ─┬─ property-tests × 3
#                           ├─ cross-linux-oracle
#                           ├─ determinism (small corpus on PRs, full on main)
#                           └─ property-oracle × 2 (4 case lists each)
#
# Two other changes cut the per-job floor and the per-compile cost:
#   - .github/actions/opam-deps caches ~/.opam, so `opam install --deps-only`
#     stops reinstalling all 46 packages (~2.3min) in every job;
#   - the compiler now caches compiled C-runtime objects
#     (lib/cas/runtime_archive.ml), so `march --compile` no longer rebuilds
#     the whole ~20-file runtime per invocation — which is most of what the
#     Test step and the ASAN gate were actually spending their time on.
#
# What every job checks, in one table: .github/workflows/README.md.
#
# Every job carries timeout-minutes: a dune build/runtest can wedge on its RPC
# daemon (see CLAUDE.md/scripts/run-tests.sh), and before these were added a
# single wedged step silently ate the full 6h GitHub Actions job ceiling.

name: CI

# A change that touches ONLY Markdown skips this workflow: nothing here reads
# the repo's .md files (forge's tests read a README.md they generate in a temp
# project). The checks that do read them -- stale source pointers, stdlib and
# corpus counts -- are doc-lint.yml, which runs on every change. A change that
# mixes .md with anything else runs everything.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# One live run per pull request: a newer push cancels the older run instead of
# letting both hold runner slots. The org is on GitHub's free plan (20 concurrent
# Linux jobs, 5 macOS, org-wide) and one run of this workflow alone asks for
# more than that, so a superseded run is queue time for every other PR.
#
# Pushes to main share one group WITHOUT cancel-in-progress. GitHub keeps at
# most one running plus one pending run per group and cancels the older pending
# run when a newer one arrives, so: the main run already in flight finishes and
# gets its verdict, but a burst of merges collapses to a single queued run
# instead of a dozen each holding ~35 job slots (a 12-merge burst on 2026-09-22
# left PR jobs queued for 80+ minutes). Intermediate main commits therefore get
# no CI verdict of their own; the nightly gate already skips cancelled runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The long pole, sharded. One `dune runtest` here took ~36 min on ubuntu
  # (September 2026), and it was ~9 min of build followed by three suites
  # running side by side on a 4-vCPU runner: march-codegen ~24 min,
  # march-refinecheck ~23, march-compiler ~17; everything else together
  # finished in under 10. Each of those three is now its own shard, run
  # through its per-test alias; `rest` is `dune runtest` with
  # MARCH_CI_RUNTEST_SPLIT=1, which drops exactly those three stanzas (see the
  # comment above the test runners in test/dune). Together the four shards run
  # the same set as one `dune runtest`. If you add a fifth shard, gate its
  # stanza in test/dune the same way or it runs twice.
  #
  # Ubuntu only. macOS stays ONE `dune runtest` job (`all`): there the unsharded
  # run took ~32 min, off the critical path, and the same split measured 67
  # job-minutes across four jobs (each shard rebuilds and loses the in-job
  # parallelism) against a 5-job org-wide macOS cap. Splitting macOS bought no
  # wall time and doubled what it costs every other PR's queue.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: codegen }
          - { os: ubuntu-24.04, shard: refinecheck }
          - { os: ubuntu-24.04, shard: compiler }
          - { os: ubuntu-24.04, shard: rest }
          - { os: macos-15,     shard: all }
    runs-on: ${{ matrix.os }}
    # Must stay above the Test step's 75 plus setup (12) and build (10).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      # cross-tools: `dune runtest` includes a linux/amd64 TLS+gzip test that
      # shells out to `zig cc` against the fetched sysroot. Installed for every
      # shard (~10s) rather than tracking which suite that test lives in.
      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup
        with:
          cross-tools: "true"

      - name: Build
        timeout-minutes: 10
        run: |
          eval $(opam env)
          # Clear any stale daemon state before the first dune invocation of the
          # job (cheap defense-in-depth against the wedge noted at the top of
          # this file; likely a no-op on a fresh GH-hosted runner, but mirrors
          # scripts/run-tests.sh's MARCH_DUNE_SHUTDOWN).
          dune shutdown 2>/dev/null || true
          # Build the public exe directly (bin/main.exe = `march`), NOT `@install`
          # (which also builds forge/march-lsp — neither is referenced anywhere
          # else in this job) and NOT a bare `dune build`. A no-target `dune build`
          # intermittently wedges at ~0% CPU AFTER building everything — even the
          # narrower `@install` alias hit this once in CI (a `Build` step silently
          # ate the full 6h job ceiling). A single explicit exe target is the
          # narrowest safe scope; `dune runtest` below still builds+runs the full
          # test suite (incl. forge/lsp), so those compile errors are still
          # caught, just one step later.
          dune build bin/main.exe

      # A test binary killed by a signal its own handler never saw (a bare
      # "Segmentation fault (core dumped)" from `sh -c ./native_X`) leaves no
      # trace on a stock runner: the default core_pattern pipes to apport,
      # which discards cores of unpackaged binaries. Write them to a known
      # directory instead; the Test step raises the core limit, and the two
      # steps after it backtrace and upload them, on failure only.
      # specs/todos/2026-10-07-flake-bare-sigsegv-native-fixtures-linux.md
      - name: Capture test cores (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /tmp/march-cores && sudo chmod 1777 /tmp/march-cores
          # %E: the executable's absolute path with '/' written as '!'.
          sudo sysctl -w kernel.core_pattern='/tmp/march-cores/core.%p.%E'

      - name: Test (${{ matrix.shard }})
        # Sized for the unsharded macOS run: 37-49 min on main in late
        # September 2026 (run_codegen alone took 28-29 min on a slow macOS
        # runner; the ubuntu shards are well under it). 45 was hit on main
        # itself; 75 leaves ~50% over the worst run seen. Don't split the
        # macOS shard to get under a timeout: that doubled its runner-minutes
        # (see README.md, "Runner budget").
        timeout-minutes: 75
        run: |
          eval $(opam env)
          if [ "$RUNNER_OS" = Linux ]; then ulimit -c unlimited; fi
          case "${{ matrix.shard }}" in
            codegen)     dune build @test/runtest-run_codegen ;;
            refinecheck) dune build @test/runtest-test_refinecheck ;;
            compiler)    dune build @test/runtest-run_compiler ;;
            rest)        MARCH_CI_RUNTEST_SPLIT=1 dune runtest ;;
            # macOS skips the suites whose answer does not depend on the OS
            # (refinecheck, golden diagnostics, LSP; see "CI sharding" in
            # test/dune): they run on the ubuntu shards, and this runner's 3
            # cores are the bottleneck of the slowest job in the workflow.
            all)         MARCH_CI_SKIP_OS_INDEPENDENT=1 dune runtest ;;
            *) echo "::error::unknown test shard '${{ matrix.shard }}'"; exit 1 ;;
          esac

      - name: Backtrace test cores (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          shopt -s nullglob
          cores=(/tmp/march-cores/core.*)
          echo "${#cores[@]} core file(s) in /tmp/march-cores"
          [ ${#cores[@]} -gt 0 ] || exit 0
          sudo apt-get install -y gdb > /dev/null
          for c in "${cores[@]:0:8}"; do
            exe=$(basename "$c" | sed 's/^core\.[0-9]*\.//; s/!/\//g')
            echo "::group::$c ($exe)"
            if [ -f "$exe" ]; then
              cp "$exe" /tmp/march-cores/ || true
              gdb -batch -ex 'p $_siginfo' -ex 'x/6i $pc' \
                  -ex 'thread apply all bt 40' "$exe" "$c" 2>&1 | grep -v '^\[New LWP'
            else
              echo "the executable is gone (rebuilt or removed since the crash)"
            fi
            echo "::endgroup::"
          done

      - name: Upload test cores (Linux)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cores-${{ matrix.os }}-${{ matrix.shard }}
          path: /tmp/march-cores
          if-no-files-found: ignore
          retention-days: 14

  # Distributed-plane guards that used to run after `dune runtest` in the ubuntu
  # `test` leg, adding ~15 min to it serially. They need no test exe, only the
  # compiler and the staged runtime/stdlib, so they get their own runner.
  #
  # Two shards since 2026-10-02. The single job's scenarios step hit its 55 min
  # on main (runs 36945831912, 36953454223) with every scenario reporting ok:
  # nothing hung or slowed down (per-scenario times matched the green runs of
  # 2026-09-30..10-01 to within a few seconds); the four control_* scenarios
  # (135-200 s each, ~10.5 min together) took a step that already ran 39-50
  # min to ~48 min on a fast runner and ~61 on a slow one (ubuntu runners
  # come in two speeds, ~25% apart). A shard costs ~2 min of setup + build
  # (opam is cached) on one more Linux runner; each shard's scenarios take
  # ~24 min on a fast runner, ~31 on a slow one.
  # `scripts/two-node.sh --list K/N` deals the list round-robin, which splits
  # the heavy control_* / protocol_* / hcr_* families across the shards.
  # Three shards since 2026-10-05: with main red at control_artifact_digest
  # each shard stopped early, hiding that 2/2 had grown past its 50 min
  # (main run 37317973656 timed out at 51 min once the whole list ran).
  two-node:
    name: two-node (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Must stay above the scenarios step's 50 plus setup (12), build (10),
    # the soak (5) and the precompile (25).
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Build
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          # stage-source-trees refreshes _build's copies of runtime/ and
          # stdlib/, which every native compile below links and reads (see the
          # rule in test/dune); on this job nothing else builds them first.
          # forge: the cert_* scenarios issue their certificates with
          # `forge cluster` (keygen / cert / revoke).
          # test/hcr_deploy.exe: the hot-deploy scenarios (hcr_new_code_session,
          # protocol_evolve) drive their reload sockets with it.
          dune build bin/main.exe forge/bin/main.exe test/hcr_deploy.exe @test/stage-source-trees

      # node_discovery was quarantined 2026-08-08 for a torn-stdout race seen
      # ~1-in-2 on THIS runner and fixed 2026-08-21 (march_stdout_mu). It is
      # back on runtest; this step is the trial that justifies that, and the
      # guard that keeps it: the compiled binary 200 times, each run's sorted
      # output diffed against the golden, the first tear or crash reported
      # verbatim. ~40s. See specs/todos/2026-09-14-distributed-plane-known-gaps.md.
      - name: Soak node_discovery (torn-stdout guard)
        if: matrix.shard == 1
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build test/native_node_discovery.out
          bin=_build/default/test/native_node_discovery
          exp=test/native/node_discovery.expected
          for i in $(seq 1 200); do
            if ! "$bin" > /tmp/nd.out 2>/tmp/nd.err; then
              echo "::error::node_discovery run $i exited $? (stderr follows)"; cat /tmp/nd.err; exit 1
            fi
            if ! LC_ALL=C sort /tmp/nd.out | diff -q - "$exp" > /dev/null; then
              echo "::error::node_discovery run $i: sorted output differs from the golden"
              LC_ALL=C sort /tmp/nd.out | diff - "$exp" || true
              exit 1
            fi
          done
          echo "node_discovery: 200/200 runs matched the golden"

      # Compiling is most of a scenario's time, and the loop below is serial.
      # This compiles every node of the shard 4 at a time first (one per
      # runner vCPU); each scenario then copies its binaries instead
      # (TWO_NODE_PREBUILT). It is done before any scenario starts, so no
      # deadline ever races a compile. The control_* scenarios and any node
      # with COMPILE_FLAGS_<x> (keys generated at run time) are not
      # prebuilt; they still compile in their scenario. A node that fails
      # here is not an error: its scenario compiles it again and reports it.
      - name: Precompile two-node nodes (${{ matrix.shard }}/3)
        timeout-minutes: 25
        run: |
          eval $(opam env)
          list=$(scripts/two-node.sh --list ${{ matrix.shard }}/3) || exit 1
          pre="$RUNNER_TEMP/two-node-prebuilt"
          # shellcheck disable=SC2086 # one word per scenario
          TWO_NODE_JOBS=4 scripts/two-node.sh --precompile "$pre" $list
          echo "TWO_NODE_PREBUILT=$pre" >> "$GITHUB_ENV"

      # Two real OS processes, a fault applied from outside (SIGKILL + restart
      # with a new creation), per-node goldens. 10-200 s per scenario, almost
      # all of it compiling the nodes (now mostly done by the step above). Each scenario
      # is test/two_node/<name>/; see specs/progress/2026-09-14-two-node-failure-semantics-harness.md.
      - name: Two-node scenarios (${{ matrix.shard }}/3)
        # 71 scenarios as of 2026-10-02: ~31 min per shard on a slow runner
        # (~61 unsharded), ~24 on a fast one. 50 leaves room for the list to
        # grow. When a shard's green runs reach ~40 min, add a third shard (N
        # in both the matrix and the --list below) rather than raising this.
        timeout-minutes: 50
        run: |
          eval $(opam env)
          # The list is captured, not looped over inline: `for s in $(...)`
          # ignores a failing --list and would run zero scenarios, green.
          list=$(scripts/two-node.sh --list ${{ matrix.shard }}/3) || exit 1
          [ -n "$list" ] || { echo "::error::shard ${{ matrix.shard }}/3 lists no scenarios"; exit 1; }
          echo "shard ${{ matrix.shard }}/3: $(echo "$list" | wc -l) scenarios"
          for s in $list; do scripts/two-node.sh "$s" || exit 1; done

  # Static-semantics + grammar corpora, doc notebooks and formatting: all
  # independent of `dune runtest` and of each other, and all short — grouped
  # into one job rather than four so they don't each pay job-setup overhead.
  # Compiles every gated bench/*.march with --opt 2, runs it, and checks the
  # value it prints. This is the only thing in CI that runs the benchmarks at
  # all: they are not part of runtest, and three of them (tree_transform,
  # iolist_template, string_pipeline) were silently broken for weeks before the
  # gate existed. The gate was written to prevent exactly that, then was never
  # wired up, so 17 benches drifted out of the manifest unnoticed — see
  # specs/progress/2026-09-16-bench-gate-manifest-and-ci.md.
  #
  # Its OWN job, deliberately, not a step in `conformance`. It compiles and runs
  # 43 programs, which leaves far more workspace state behind than a check
  # ought to impose on whatever runs after it: as a `conformance` step it was
  # followed by a reproducible failure of the NEXT step (the stdlib doctest
  # REPL returning `false` for `Path.is_absolute("/etc")`) that did not occur
  # on main with the identical compiler and stdlib. A job boundary is the
  # cheapest way to keep a benchmark runner from being able to do that, and it
  # runs in parallel besides. ~72s locally for 43 benches, compile-dominated.
  bench-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Benchmark output gate (not part of runtest)
        timeout-minutes: 15
        run: |
          eval $(opam env)
          dune build @bench_gate

  # tree-sitter-march/ (the grammar Zed highlights from) against the March the
  # compiler accepts: freshness of the generated parser, the corpus tests, the
  # query files, and a list ratchet over every .march file in the repo
  # (scripts/check-tree-sitter.sh; design in
  # specs/2026-09-23-tree-sitter-grammar-sync-design.md). No opam or dune:
  # the CLI, a C compiler and python3 are all it needs, and tree-sitter output
  # does not depend on the OS, so one Linux leg is enough. The CLI is pinned
  # because another version regenerates parser.c differently.
  tree-sitter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI 0.26.7
        timeout-minutes: 5
        run: npm install -g tree-sitter-cli@0.26.7

      - name: Self-test (the check measures the grammar it builds)
        timeout-minutes: 3
        run: scripts/check-tree-sitter.sh --self-test

      - name: Grammar freshness, corpus, queries, parse ratchet
        timeout-minutes: 3
        run: scripts/check-tree-sitter.sh

  # Ubuntu only since 2026-10-07. Every step here is either frontend-only
  # (`--check`, the same answer on both OSes) or already skipped on macOS;
  # the one OS-sensitive check, @vault-scale, runs in `macos-checks` too.
  # The macOS leg cost a macOS slot (5 for the whole org) per run.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Static-semantics conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build @types-check

      # Refinement checking reports a violation only when a predicate can NEVER
      # hold; every other outcome is silence. Silence therefore does not
      # distinguish "proved" from "the checker could not decide it" — an
      # ambiguity that let `{List(a) | len(_) > 0}` ship enforcing nothing while
      # the whole suite stayed green. `--refine-report` counts the obligations,
      # and this step ratchets the count so coverage cannot quietly regress.
      #
      # Lives in `conformance`, not beside `scripts/check-docs.sh` in `doc-lint`:
      # that job is a bare checkout with neither a built compiler nor z3 on PATH,
      # and this step needs both.
      - name: Refinement obligation coverage ratchet
        timeout-minutes: 5
        run: |
          set -euo pipefail
          eval $(opam env)
          # This ratchet is two INDEPENDENT bounds, read from two different
          # files, because no single file was a good source for both:
          #
          #   CEILING (skips must not rise) — read from the whole-program
          #   (`user + stdlib`) slice of stdlib/list.march. Measured
          #   2026-07-29: 8 proved, 0 violated, 28 skipped (unreflectable-
          #   predicate 1, solver-undecided 27).
          #
          #   RAISED 2026-08-06, 28 -> 34, deliberately. Adding a refinement
          #   to a stdlib function RAISES an obligation at every stdlib-
          #   internal call site of it, and the ones that are not guarded
          #   land as skips — so contracting more of the stdlib pushes this
          #   number UP even though the checker is strictly checking more.
          #   The proof-based `cap no_panic` branch contracted 13 new
          #   parameters across stdlib/stats.march and stdlib/random.march
          #   (Stats percentile/quantile/quantiles/five_number_summary/
          #   variance/mode/covariance/correlation/linear_regression,
          #   Random.choice_weighted). Attributed, not assumed: reverting
          #   ONLY those two files on the merged branch and re-measuring
          #   reproduces main's exact 15 proved / 24 skipped, so the whole
          #   +1 proved / +10 skipped delta is those contracts and nothing
          #   else regressed. Note the 24 here vs the 28 recorded above:
          #   main had already travelled down to 24 since 2026-07-29.
          #
          #   RAISED 2026-09-14, 34 -> 46, deliberately, for the same
          #   reason: Array.get/set/pop gained bounds contracts, which
          #   raises 15 obligations at the stdlib's own Array call sites
          #   (aho_corasick, rrb_vec, …) in every program. Attributed with
          #   scripts/refine-oracle.sh against a compiler built at main:
          #   this file's slice went 17 proved / 33 skipped -> 19 proved /
          #   46 skipped, exactly the +2 proved / +13 skipped every one of
          #   the 326 other fixtures gained, and no verdict elsewhere moved.
          #
          #   LOWERED 2026-09-16, 46 -> 43: `pmap_threshold()` gained a
          #   `{Int | _ > 0}` contract (Refine_encode.builtin_ret_
          #   refinements), which discharges the three `chunks(xs, t)` call
          #   sites in List.pmap/pfilter/preduce that were previously
          #   unconstrained-subject skips. Measured on this file: 38 proved /
          #   46 skipped -> 41 proved / 43 skipped, +3 proved / -3 skipped,
          #   the same three sites --refine-report-sites attributes.
          #
          #   LOWERED 2026-09-16, 43 -> 42: an `if`-shaped `let` RHS now
          #   pushes the disjunction `(g && n == a) || (!g && n == b)`, which
          #   discharges List.pfilter's `chunks(xs, csize2)` — the one pure
          #   local-value-flow site in the stdlib.
          #
          #   Lower is better — this bound
          #   may only ever be revised DOWN. This is the check that is
          #   actually sensitive to the pass checking less than it used to:
          #   if the walk still descends into the file but proves fewer of
          #   the obligations it raises, skips rises and this fires.
          #
          #   FLOOR (proved must not fall) — a ceiling alone is not a ratchet:
          #   if the walk stopped descending into a file ENTIRELY, it raises
          #   zero obligations there and reports 0 skipped, satisfying the
          #   ceiling trivially. stdlib/list.march cannot host this floor:
          #   its OWN (`user code`) slice is 0 proved / 0 violated / 5 skipped
          #   — every one of its 8 "proved" obligations comes from the
          #   prepended stdlib prelude, not from the file, so an empty file
          #   reports the same 8 and the floor would defend nothing. Instead
          #   read the `user code` slice of a small fixture that itself
          #   proves something: specs/lang/types/accept/t118_refine_length_
          #   guard_discharges.march, whose `user code` slice is 1 proved /
          #   0 violated / 0 skipped (measured 2026-07-29). Higher is better
          #   — this bound may only ever be revised UP.
          baseline=42
          proved_floor=1
          floor_fixture=specs/lang/types/accept/t118_refine_length_guard_discharges.march
          dune build bin/main.exe
          # A `--check` whose sources hash to an artifact already in the CAS
          # exits BEFORE parsing (bin/main.ml, the `do_check` lookup), so the
          # report never runs and the command prints nothing while exiting 0.
          # `--refine-report` is not part of the cache key, so a plain `--check`
          # from an earlier step (or from the other measurement below) is
          # enough to poison the next one. Clear the check artifacts before
          # EACH measurement so both are always real. NOTE this is
          # artifacts-v2, not `.march/cas/vc` — vc holds solver verdicts and has
          # no bearing on whether the report prints.

          rm -rf .march/cas/artifacts-v2
          ./_build/default/bin/main.exe --check --refine-report "$floor_fixture" \
            > /tmp/refine_floor.txt 2>&1 || true
          cat /tmp/refine_floor.txt
          # Read the file's OWN (`user code`) slice specifically. `--refine-
          # report` prints two labelled lines (user code, and user + stdlib,
          # because the driver prepends the entire standard library); a bare
          # `grep -o '[0-9]* proved'` would match both and silently read the
          # wrong one.
          proved=$(sed -n \
            's/^refinement obligations (user code): \([0-9][0-9]*\) proved,.*/\1/p' \
            /tmp/refine_floor.txt)
          if [ -z "$proved" ]; then
            echo "FAIL: could not find the 'user code' line in --refine-report output"
            echo "for $floor_fixture."
            echo "Three things produce that, in order of likelihood:"
            echo "  a. the run hit the --check CAS and short-circuited before the"
            echo "     report — clear .march/cas/artifacts-v2 (the rm above should"
            echo "     already do this; check it did not get dropped);"
            echo "  b. the compiler errored before printing;"
            echo "  c. the report's format changed — update the sed above."
            echo "This step must never pass vacuously."
            exit 1
          fi
          echo "proved=$proved (floor: $proved_floor), read from $floor_fixture's user code slice"
          if [ "$proved" -lt "$proved_floor" ]; then
            echo ""
            echo "FAIL: refinement obligations PROVED fell from $proved_floor to $proved"
            echo "on $floor_fixture's own (user code) slice."
            echo "The ceiling on skips (measured on a different file, below) cannot"
            echo "catch this: a pass that stopped descending into a file entirely"
            echo "reports 0 skipped there too and would sail through it."
            echo "Fewer proofs means contracts that were enforced no longer are."
            echo ""
            echo "The most common cause is a measure alias being withdrawn too"
            echo "eagerly — the gates in lib/refinecheck/refine_check.ml"
            echo "(stdlib_member_defs_ok / bare_builtin_undefined) suppress on"
            echo "doubt, so widening one can switch the feature off wholesale."
            echo "Check the per-reason breakdown printed above: proofs turning"
            echo "into 'solver-undecided' skips is that signature."
            exit 1
          fi

          rm -rf .march/cas/artifacts-v2
          ./_build/default/bin/main.exe --check --stdlib-source --refine-report stdlib/list.march \
            > /tmp/refine_ceiling.txt 2>&1 || true
          cat /tmp/refine_ceiling.txt
          # Read the whole-program slice specifically, same reasoning as above.
          skipped=$(sed -n \
            's/^refinement obligations (user + stdlib):.*, \([0-9][0-9]*\) skipped$/\1/p' \
            /tmp/refine_ceiling.txt)
          if [ -z "$skipped" ]; then
            echo "FAIL: could not find the 'user + stdlib' line in --refine-report output"
            echo "for stdlib/list.march."
            echo "Three things produce that, in order of likelihood:"
            echo "  a. the run hit the --check CAS and short-circuited before the"
            echo "     report — clear .march/cas/artifacts-v2 (the rm above should"
            echo "     already do this; check it did not get dropped);"
            echo "  b. the compiler errored before printing;"
            echo "  c. the report's format changed — update the sed above."
            echo "This step must never pass vacuously."
            exit 1
          fi
          echo "skipped=$skipped (ceiling: $baseline), read from stdlib/list.march's user + stdlib slice"
          if [ "$skipped" -gt "$baseline" ]; then
            echo ""
            echo "FAIL: refinement obligation skips rose from $baseline to $skipped."
            echo "A RISE IN SKIPS MEANS FEWER OBLIGATIONS ARE BEING CHECKED — contracts"
            echo "that used to be proved are now silently unenforced. This is a"
            echo "regression even though nothing errored, because March's default"
            echo "stance turns an undischarged obligation into silence."
            echo ""
            echo "What to do:"
            echo "  1. Run it locally, against a COLD CHECK CACHE:"
            echo "       rm -rf .march/cas/artifacts-v2"
            echo "       ./_build/default/bin/main.exe --check \\"
            echo "         --stdlib-source --refine-report stdlib/list.march"
            echo "     Without that rm, a cached --check exits before the report runs"
            echo "     and you get empty output, not a smaller number. Add"
            echo "     'rm -rf .march/cas/vc' as well only if you want z3 to re-decide"
            echo "     from scratch — that is a separate cache and does not affect"
            echo "     whether the report prints at all."
            echo "  2. Diff the per-reason breakdown against the baseline above. A jump"
            echo "     in 'solver-undecided' usually means a measure alias was withdrawn"
            echo "     or a guard stopped reflecting; 'unreflectable-predicate' means a"
            echo "     contract was rewritten outside the supported fragment."
            echo "  3. A missing z3 does NOT show up as skips falling — it shows up as"
            echo "     skips RISING. Without a solver every obligation is Unverified,"
            echo "     so the measured signature is 0 proved / 36 skipped (every one of"
            echo "     the 8 proofs becomes a skip). If you see that pair, check the"
            echo "     toolchain step before blaming the code."
            echo "  4. Fix the regression. Only raise the ceiling if the rise is"
            echo "     intentional and explained in the commit message; this number is"
            echo "     meant to travel downward."
            exit 1
          fi

      - name: Resolved-grammar conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @grammar-check

      # Vault's striped reader-count lock (runtime/march_extras.c,
      # vault_rwlock_t): T = min(4, ncores) threads reading DISTINCT keys
      # should scale close to 1x wall-clock (measured ~2.0x median at T=4 on
      # a loaded 14-core dev box; see test/test_vault_distinct_keys_scale.c's
      # header for the full history). The test reads sysconf's online core
      # count at runtime and adapts both its thread count and its bound
      # (solo_median * (T * 0.9)) to it — hosted runners here have only 2-4
      # cores, and a hard-coded 4-thread shape can't show speedup on that
      # regardless of lock quality, so this is NOT a claim that these
      # runners are "quiet" (that reasoning was wrong; the constraint is
      # core count, not load). Still NOT part of `runtest` — it is a
      # parallel-scaling benchmark, not a unit test. Same "own alias, run
      # explicitly" shape as @types-check / @grammar-check above.
      - name: Vault distinct-key read-scaling benchmark (not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @vault-scale

      - name: Check doc notebooks (.scrollmd) compile
        timeout-minutes: 5
        run: |
          eval $(opam env)
          MARCH_BIN="dune exec march --" python3 scripts/gen-scrollmd.py --check

      # Runs the JIT REPL and validates every stdlib `march>` example against the
      # value it renders. A HARD gate on Linux, where it is deterministic and
      # clean. Not run on macOS (this job is Linux-only): the JIT's core cross-dylib string miscompile is
      # now FIXED (repl_jit.ml two-level runtime link, see
      # specs/progress/2026-08-09-jit-macos-cross-dylib-string-miscompile.md), but
      # the GitHub macos-15 runner has a RESIDUAL nondeterminism even with the fix
      # (first runtime .so built in a job can still miscompile) that needs a
      # macOS 15 host to root-cause. Once that residual is gone, add it to `macos-checks`.
      #
      # The build is its own step so the doctest step's time is the script
      # alone. (bin/main.exe is normally already built by the refinement
      # ratchet above, so the build step should take seconds.)
      - name: Build compiler for stdlib doctests
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune build bin/main.exe

      # This step used to take 3-5 min and hit its 5 min budget (PR #663).
      # The cause was not the runner: @vault-scale above stages a PARTIAL
      # _build/default/runtime, the driver built its runtime .so from it
      # without march_nacl.c, and the REPL's cached stdlib prelude then
      # failed to load and was recompiled in all seven sessions. With the
      # driver fixed (bin/toolchain.ml, runtime_dir_complete) it takes under
      # a minute, and the script fails if the prelude ever falls back to
      # recompiling again.
      - name: Check stdlib `march>` doctests
        timeout-minutes: 5
        run: |
          eval $(opam env)
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            python3 scripts/check-stdlib-doctests.py --check

  # AddressSanitizer sweep over three corpora on this runner.
  # sanitize.sh covers every specs/lang/golden/*.march; a curated by-name list of
  # test/native/*.march SIMD / NativeArray-narrow-width / array-backed-Bytes and
  # closure-ownership programs — that second corpus was added 2026-08-20 because
  # no sanitizer had ever compiled that code (the golden corpus contains zero
  # SIMD/NativeArray programs); and, since 2026-09-16, the two-node scenarios,
  # which run two compiled programs as two processes over a real socket. That
  # third corpus exists because on 2026-09-16 a closure deep drop released a node
  # id the members Map still owned and BOTH other corpora swept clean while
  # `two-node[skew]` died. See the script header for why the curated list is a
  # list and not a glob, and why those programs are not simply new goldens.
  #
  # Ubuntu-only: the gate no-ops on a Mac running CrowdStrike Falcon, whose
  # syscall interception hangs ASAN's shadow-memory setup.
  #
  # Three shards since 2026-10-07 (the split the 2026-10-02 note below asked
  # for). The single job took 36-42 min, ~31 of them the two-node sweep: ~8
  # compiling every node up front and ~23 running the scenarios one at a time,
  # 18 of those in the 11 scenarios that compile their own nodes. Now each
  # shard sweeps a third of the scenarios (`scripts/two-node.sh --list K/3`,
  # round-robin over the sorted list, which deals the heavy control_* family
  # across the shards); shard 1 also runs the golden and native corpora
  # (~4 min), and the others skip them with SANITIZE_TWO_NODE_ONLY=1.
  sanitize-gate:
    name: sanitize-gate (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Step (45) + toolchain setup (12), rounded up.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: AddressSanitizer gate (RC/UAF guard) — shard ${{ matrix.shard }}/3
        # History of the unsharded step's limit: 15 min covered golden + native
        # and the first 14 two-node scenarios; 45 -> 65 on 2026-09-26 and
        # 65 -> 85 on 2026-10-02 as the scenario list grew (ubuntu runners come
        # in two speeds, ~25% apart; main runs 36218685305, 36953454223). A
        # shard should take ~15 min on a slow runner; 45 leaves room for the
        # list to grow. When a shard's green runs pass ~30 min, add a fourth
        # shard (N here and in the matrix) rather than raising this.
        timeout-minutes: 45
        env:
          SANITIZE_TWO_NODE_SHARD: ${{ matrix.shard }}/3
          SANITIZE_TWO_NODE_ONLY: ${{ matrix.shard != 1 && '1' || '0' }}
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          # test/hcr_deploy.exe: the two-node sweep's hot-deploy scenarios.
          dune build bin/main.exe forge/bin/main.exe test/hcr_deploy.exe
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            ./specs/lang/golden/sanitize.sh

  # Build once, fan out via same-run artifacts (not a persistent actions/cache):
  # cross-linux-oracle and the property-oracle shards below each used to
  # independently pay ~2.3min opam-install + a fresh `dune build` — 9 job
  # instances redoing identical work. Neither of them needs a coherent local
  # `_build`/incremental dune state the way the `dune runtest`-based test job
  # does (they just RUN a prebuilt exe), so a single upstream build here is
  # safe to fan out as plain files rather than a dune-mediated cache —
  # deliberately NOT `actions/cache` on `~/.cache/dune` for this: this project
  # already hit a dune shared-cache-poisoning incident (a stale artifact from
  # a differently-flagged/differently-versioned compiler silently re-served
  # across worktrees), and a run-scoped artifact can't leak across runs by
  # construction, which a persistent cache key can't guarantee no matter how
  # carefully the key is chosen.
  # Ubuntu only since 2026-10-07: the macOS property groups run in
  # `macos-checks`, which builds its own exes, so a macOS leg here would be
  # one more macOS job per run (5 slots for the whole org). It feeds
  # property-tests, cross-linux-oracle, determinism and the property-oracle
  # shards. The `os` matrix and artifact names keep the OS in them, so a
  # second leg is a one-line change.
  ocaml-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      # forge/bin/main.exe is here for the determinism job: its topology_app
      # leg needs `forge topology check` to write the --topology digest.
      - name: Build compiler + oracle binaries
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe forge/bin/main.exe test/test_oracle.exe test/test_properties.exe

      - name: Upload built exes
        uses: actions/upload-artifact@v4
        with:
          name: ocaml-build-exes-${{ matrix.os }}-${{ github.run_id }}
          retention-days: 1
          path: |
            _build/default/bin/main.exe
            _build/default/forge/bin/main.exe
            _build/default/test/test_oracle.exe
            _build/default/test/test_properties.exe

  # Cross-compilation gate (P1): cross-compile the deterministic examples+golden
  # corpus to Linux via `zig cc` and assert byte-identical output to the native
  # build (native-referenced).  Targets linux/amd64 so the cross binaries run
  # NATIVELY on the x86_64 runner (no QEMU) — QEMU user-mode emulation produces
  # spurious segfaults that the oracle would count as failures.  arm64 coverage
  # needs a native arm64 runner (ubuntu-24.04-arm) — a follow-up.  This still
  # exercises the whole LinuxGnu / zig-cc / arch-flag / external-lib-stripping
  # path end to end.
  cross-linux-oracle:
    runs-on: ubuntu-24.04
    needs: [ocaml-build]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # No OCaml/opam/dune here at all: this job only RUNS a prebuilt exe from
      # ocaml-build (a standalone native binary needs no OCaml toolchain to
      # execute) — only the system deps below (needed for the dynamic linker
      # to resolve libblake3.so at process start) and zig (needed because
      # test_oracle.exe's own MARCH_ORACLE_CROSS logic shells out to `zig cc`
      # for the cross-compile) are actually required at runtime.
      - name: Install system dependencies (blake3 for the native reference build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      - name: Install zig (the C cross-compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # path: _build/default, NOT `.` — upload-artifact@v4 strips the uploaded
      # paths' least common ancestor, which for the three exes is
      # `_build/default`, so the artifact's own entries are `bin/main.exe` and
      # `test/*.exe`. Downloading to `.` therefore lands them at ./bin/... and
      # every reference below (which uses the in-repo _build path, as the
      # exes' own runtime-dir lookup expects) misses.
      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          # ubuntu leg specifically: this job is Linux-only.
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/bin/main.exe _build/default/test/test_oracle.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              echo "Artifact layout actually downloaded:"; find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      - name: Cross oracle (linux/amd64, native-referenced, runs natively on the x86_64 runner)
        # Measured 2026-10-08: main's run took 1,181 s (14.8 s per program, 81
        # programs, mostly the native reference compile on a cold CAS) against
        # the old 20-minute (1,200 s) limit, 19 s of headroom; a run 4% slower
        # (merge train, PR #924) was killed at program 79 of 81.
        timeout-minutes: 30
        run: |
          MARCH_ORACLE_CROSS=amd64 \
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
          MARCH_ROOT="$PWD" \
          ./_build/default/test/test_oracle.exe

  # Determinism oracle (incremental-codegen plan A5): the same source compiled
  # under a cold and a warm private $HOME and from two cwds must emit
  # byte-identical LLVM IR and per-definition CAS hashes.  Cache warmth once
  # changed the TIR of an unchanged program (PRs #805/#807), which both
  # missed the post-TIR cache and meant the compiler's output depended on
  # state outside the source.  B1 (deterministic symbols) cites this job as
  # its acceptance check.  Linux-only: the property is about the compiler's
  # process state, not the OS.  Runs --self-test first so a vacuous oracle
  # (one that cannot go red) fails the job rather than passing it.
  # Like cross-linux-oracle, no OCaml toolchain: it runs the ubuntu
  # ocaml-build exe, which only needs libblake3.so at process start.
  #
  # Corpus by event (2026-10-07): pull requests run `--corpus small` (the
  # TIR snapshot programs + topology_app, ~30 programs, ~2 min), pushes to
  # main run `--corpus all` (~417 programs, ~50 min). The full corpus was the
  # slowest job on every PR. A drift that only a program outside the small
  # corpus shows is caught by the next main run, which the nightly gate reads.
  determinism:
    runs-on: ubuntu-24.04
    needs: [ocaml-build]
    # Sized from a measured run (specs/progress/2026-10-06-determinism-oracle.md):
    # 13 CPU-s per program × 417 programs ≈ 91 CPU-min, ~23 min on a 4-vCPU
    # runner at the dev box's per-core speed; 70 allows ~2.5x slower cores.
    # Tighten after a few CI data points.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (blake3, the compiler's only runtime .so)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo ldconfig

      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          for f in _build/default/bin/main.exe _build/default/forge/bin/main.exe; do
            [ -f "$f" ] || { echo "::error::$f missing from the ocaml-build artifact"; exit 1; }
            chmod +x "$f"
          done

      - name: Self-test (the oracle must go RED on a perturbed stdlib)
        timeout-minutes: 5
        run: scripts/determinism-oracle.sh --self-test

      - name: Determinism oracle (${{ github.event_name == 'push' && 'full' || 'small' }} corpus)
        timeout-minutes: 60
        run: scripts/determinism-oracle.sh --corpus ${{ github.event_name == 'push' && 'all' || 'small' }}

  # Differential-oracle CI (test/test_properties.ml's "oracle: interp = compiled"
  # group, ~1090 QCheck-generated compile-vs-interpret comparisons). This is NOT
  # wired into `dune runtest`'s Test step above: MARCH_BIN isn't set there, so
  # all 1090 checks silently skip (confirmed identical across every historical
  # CI run — "no-march-binary", 0 matched). Wiring MARCH_BIN into that step
  # directly isn't viable either: each unique generated program is a real
  # `--compile` that the whole-binary CAS can never hit (distinct sources), so
  # all 1090 would add well over an hour to the Test job on every push.
  # Instead this runs as its own job: eight case lists selected by alcotest's
  # own case-number filtering (`test <suite> <cases>`), run four at a time on
  # each of two runners, hand-balanced by measured per-case cost (not a naive
  # index range) so no single list is dominated by the two heavier cases (case 0 = println_arith at QCheck count 100; case 20
  # = opt_matrix at count 20 * 2 opt levels).
  # test_properties.exe's QCheck property groups — everything in that binary
  # EXCEPT the interp-vs-compiled oracle group (which property-oracle below
  # runs, sharded, with MARCH_BIN set).
  #
  # Why this is its own job: measured on CI, this binary was 652s of the Test
  # step's 756s — the single dominant cost of `dune runtest` and of the whole
  # workflow's critical path. alcotest has no parallelism of any kind (no
  # --jobs/--parallel; cases run sequentially in-process), so the only lever is
  # running several filtered processes concurrently. test/dune therefore takes
  # it out of the `runtest` alias and this job runs it instead.
  #
  # Selection is by group-name REGEX, which has two sharp edges worth knowing:
  #   - alcotest's filter is a regex, so `+` and `(` in group names must be
  #     escaped — an unescaped name silently matches NOTHING and the shard
  #     "passes" in ~0s having run nothing. The coverage guard below exists
  #     precisely because that failure mode is invisible.
  #   - the oracle group must NOT be matched here. It is excluded by omission,
  #     so a new group added upstream would also be silently skipped — hence
  #     the guard asserting every listed group is covered by some shard.
  # Linux here; macOS runs the same groups in ONE job, `macos-checks` below.
  # They must still run on macOS: before this job existed they ran under
  # `dune runtest` on both OSes, and the groups that shell out to the
  # compiler (record-update converged, cli: timings) and test_properties.ml's
  # macOS-only Sys_error case are where the OSes can differ. Until 2026-10-07
  # this matrix had a macOS leg of three shards plus a macOS ocaml-build:
  # four macOS jobs for ~7 min of tests.
  property-tests:
    runs-on: ${{ matrix.os }}
    needs: [ocaml-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `shard` must be a real matrix dimension, NOT just `include` entries:
        # with only `os` listed here, each `include` object would be merged
        # into every os combination and later objects would overwrite earlier
        # ones' `shard`/`filter` rather than producing the os × shard product
        # — silently running a subset. Listing both dimensions makes this a
        # true os × shard product, with `include` only attaching each shard's
        # filter. One os today (see above).
        os: [ubuntu-24.04]
        shard: [soundness, tir, rest]
        include:
          # `type soundness + eval` is isolated: it evaluates generated
          # programs against the full stdlib and measured far slower than
          # every other group combined, with high QCheck-seed variance.
          - shard: soundness
            filter: 'type soundness'
          - shard: tir
            filter: 'tir pipeline|tir passes|tir pass invariants'
          - shard: rest
            filter: 'algebraic oracle|semantic properties|parse\+typecheck|classify_compile|record-update converged|cli: timings'
    steps:
      - uses: actions/checkout@v4

      # Only the C libraries the prebuilt exe dynamically links — no OCaml or
      # opam here, since this job only RUNS a binary built upstream.
      - name: Install system dependencies (blake3 for the native build)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install blake3 brotli zstd llvm
          else
            sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
            git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
            cd /tmp/blake3/c
            gcc -O2 -shared -fPIC -o libblake3.so \
              blake3.c blake3_dispatch.c blake3_portable.c \
              blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
              blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
            sudo cp libblake3.so /usr/local/lib/libblake3.so
            sudo cp blake3.h /usr/local/include/blake3.h
            sudo ldconfig
          fi

      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          name: ocaml-build-exes-${{ matrix.os }}-${{ github.run_id }}
          path: _build/default
      # main.exe too, not just the test binary: two of the "(unit)" groups in
      # the `rest` shard (record-update converged, cli: timings) shell out to
      # the compiler. They locate it themselves via _build/default/bin/main.exe
      # relative to cwd, so with the artifact unpacked here they FIND it and
      # try to run it — a non-executable one fails with rc=126 rather than
      # being skipped as "no march binary". (Under `dune runtest` these skip,
      # because the test's cwd is _build/default/test where that path doesn't
      # resolve; running them here is a small coverage gain.)
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/test/test_properties.exe _build/default/bin/main.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      # Record exactly which property groups THIS shard's filter matches, for
      # the `property-coverage` job below to union and compare against the full
      # group list. This replaces a hand-maintained `COVERED` string that
      # duplicated the shard filters: that copy caught a NEWLY ADDED group (its
      # original purpose) but NOT an UNWIRED one — deleting a group from a shard
      # filter while leaving `COVERED` alone kept the guard green while the group
      # silently stopped running. Deriving coverage from the shards' own filters
      # closes that gap with a single source of truth (the matrix filters).
      - name: Record groups this shard covers
        run: |
          set -euo pipefail
          B=_build/default/test/test_properties.exe
          # `list` prints "<group> <case-index> <description>"; keep the group.
          $B list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/[[:space:]]+[0-9]+[[:space:]]+.*$//' | sed -E 's/[[:space:]]+$//' \
            | grep -v '^$' | grep -v 'qcheck random seed' | sort -u \
            | grep -E '${{ matrix.filter }}' > "covered-${{ matrix.shard }}.txt"
          echo "shard '${{ matrix.shard }}' covers:"; cat "covered-${{ matrix.shard }}.txt"

      # One artifact per (os, shard). Only ubuntu's are consumed downstream (the
      # group list is OS-independent), but uploading both keeps the step uniform.
      - name: Upload this shard's covered-groups report
        uses: actions/upload-artifact@v4
        with:
          name: covered-groups-${{ matrix.os }}-${{ matrix.shard }}
          path: covered-${{ matrix.shard }}.txt
          if-no-files-found: error

      - name: Property tests (shard ${{ matrix.shard }})
        timeout-minutes: 25
        run: |
          set -o pipefail
          # No MARCH_BIN: the oracle group is property-oracle's job. (The exe
          # would otherwise find _build/default/bin/main.exe on its own and
          # start compiling — the filters below keep it out of these shards.)
          _build/default/test/test_properties.exe test '${{ matrix.filter }}' -e 2>&1 | tee /tmp/shard.log
          ran=$(grep -cE '\[(OK|FAIL)\]' /tmp/shard.log || true)
          echo "cases actually run: $ran"
          if [ "$ran" -eq 0 ]; then
            echo "::error::shard '${{ matrix.shard }}' ran 0 cases — its filter regex matched nothing (unescaped + or ( in a group name?)"
            exit 1
          fi

  property-oracle:
    name: property-oracle (${{ matrix.shard }}/2)
    needs: ocaml-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Two runners, each running FOUR case lists side by side. Each list is
        # one test_properties.exe process, and each process is one compile at
        # a time: run one per runner (8 jobs, the layout until 2026-10-07),
        # three of a 4-vCPU runner's cores sat idle and the group cost ~95
        # Linux job-minutes plus 8 setups for ~15 min of wall time.
        #
        # The lists are the old eight shards, hand-balanced by measured cost
        # (case 0 = println_arith at QCheck count 100 and case 20 = opt_matrix
        # at count 20 * 2 opt levels are the heavy ones; on CI the old shards
        # took 9-16 min each). Each runner gets two of the slow lists and two
        # of the fast ones. The guard step below pins the case count, so a new
        # oracle case cannot land in no list.
        include:
          - shard: 1
            cases: "0,20 4,5,6 10,11,12 16,17"
          - shard: 2
            cases: "1,2,3 7,8,9 13,14,15 18,19"
    steps:
      - uses: actions/checkout@v4

      # No OCaml/opam/dune here at all — see cross-linux-oracle's comment
      # above for why; only the system deps below (dynamic-linker + the
      # generated-program-link needs of the `march --compile` subprocesses
      # this binary spawns) are actually required at runtime.
      - name: Install system dependencies (blake3 for the native build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      # path: _build/default, NOT `.` — upload-artifact@v4 strips the uploaded
      # paths' least common ancestor, which for the three exes is
      # `_build/default`, so the artifact's own entries are `bin/main.exe` and
      # `test/*.exe`. Downloading to `.` therefore lands them at ./bin/... and
      # every reference below (which uses the in-repo _build path, as the
      # exes' own runtime-dir lookup expects) misses.
      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          # ubuntu leg specifically: this job is Linux-only.
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bits (the artifact zip does not preserve them)
        run: |
          set -e
          for f in _build/default/bin/main.exe _build/default/test/test_properties.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f from the ocaml-build artifact, but it is missing."
              echo "Artifact layout actually downloaded:"; find _build -type f | head -20
              exit 1
            fi
            chmod +x "$f"
          done

      # The shards select oracle cases by INDEX, and alcotest silently ignores
      # an out-of-range index (`test <group> 0,99` runs case 0 and exits 0).
      # So adding a 22nd oracle property would run it in NO shard, and CI would
      # stay green; deleting one would shift every later index and silently
      # re-cover the wrong cases. The property-tests coverage guard cannot
      # catch either — it checks group NAMES, and this group is named there.
      # Pin the count instead: the two shards' index lists union to exactly
      # 0..20, so any change to the case count must come with a re-shard here.
      - name: Guard — oracle case count still matches the shard split
        run: |
          set -euo pipefail
          expected=21
          actual=$(./_build/default/test/test_properties.exe list 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -c '^oracle: interp = compiled' || true)
          echo "oracle cases: expected $expected, found $actual"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::the 'oracle: interp = compiled' group has $actual cases but the property-oracle case lists cover exactly $expected (indices 0..$((expected-1))). Re-balance the shard 'cases' lists in this workflow and update this guard, or the new/removed cases will silently run in no shard at all."
            exit 1
          fi

      - name: Differential oracle (shard ${{ matrix.shard }}/2, cases ${{ matrix.cases }})
        timeout-minutes: 25
        run: |
          # One process per case list, all at once, each with its own alcotest
          # log dir. Every process is waited for and every log printed, so one
          # failing list never hides another's result.
          pids=""; n=0
          for cases in ${{ matrix.cases }}; do
            n=$((n + 1))
            mkdir -p "$RUNNER_TEMP/oracle-$n"   # alcotest's -o refuses a missing dir
            MARCH_BIN="$PWD/_build/default/bin/main.exe" \
              ./_build/default/test/test_properties.exe test 'oracle: interp = compiled' "$cases" \
                -e -o "$RUNNER_TEMP/oracle-$n" > "$RUNNER_TEMP/oracle-$n.log" 2>&1 &
            pids="$pids $!:$cases:$n"
          done
          rc=0
          for p in $pids; do
            pid=${p%%:*}; rest=${p#*:}; cases=${rest%%:*}; n=${rest##*:}
            if wait "$pid"; then status=ok; else status=FAILED; rc=1; fi
            echo "::group::cases $cases: $status"
            cat "$RUNNER_TEMP/oracle-$n.log"
            echo "::endgroup::"
            [ "$status" = ok ] || echo "::error::oracle cases $cases failed (log in the group above)"
          done
          exit $rc

  # Asserts that every property group in test_properties.exe is actually run by
  # SOME property-tests shard (or is the oracle group, which property-oracle
  # owns). The truth comes from the shards' own recorded coverage (the
  # `covered-groups-*` artifacts each shard uploads), NOT a second hand-kept
  # copy of the filters — so a group dropped from a shard filter reddens here
  # instead of silently going unrun. Fail-closed: a missing artifact or an
  # unreadable list fails the job rather than passing vacuously.
  property-coverage:
    runs-on: ubuntu-24.04
    needs: [ocaml-build, property-tests]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt exes
        uses: actions/download-artifact@v4
        with:
          name: ocaml-build-exes-ubuntu-24.04-${{ github.run_id }}
          path: _build/default
      - name: Restore exec bit
        run: |
          set -e
          test -f _build/default/test/test_properties.exe \
            || { echo "::error::test_properties.exe missing from the ocaml-build artifact"; exit 1; }
          chmod +x _build/default/test/test_properties.exe

      - name: Download every shard's covered-groups report
        uses: actions/download-artifact@v4
        with:
          pattern: covered-groups-ubuntu-24.04-*
          path: covered
          merge-multiple: true

      - name: Assert the shards' union covers every property group
        run: |
          set -euo pipefail
          B=_build/default/test/test_properties.exe
          $B list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/[[:space:]]+[0-9]+[[:space:]]+.*$//' | sed -E 's/[[:space:]]+$//' \
            | grep -v '^$' | grep -v 'qcheck random seed' | sort -u > all.txt
          shards=$(find covered -name '*.txt' | wc -l | tr -d ' ')
          if [ "$shards" -eq 0 ]; then
            echo "::error::no covered-groups-* artifacts were downloaded — the property-tests shards did not report their coverage."
            exit 1
          fi
          # The oracle group is deliberately run by property-oracle, not the shards.
          { echo 'oracle: interp = compiled'; cat covered/*.txt; } | sort -u > union.txt
          echo "--- all property groups ---"; cat all.txt
          echo "--- covered (union of $shards shard reports + oracle) ---"; cat union.txt
          missing=$(comm -23 all.txt union.txt)
          if [ -n "$missing" ]; then
            echo "::error::these property groups run in NO property-tests shard and are not the oracle group — a shard filter no longer matches them:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all $(wc -l < all.txt) property groups are covered by a shard or the oracle."

  # Everything macOS needs beyond `test (macos-15, all)`, in one job: every
  # QCheck property group except the interp-vs-compiled oracle (Linux-only,
  # in property-oracle), and the OS-sensitive @vault-scale benchmark. Until
  # 2026-10-07 this was five macOS jobs (ocaml-build, three property-tests
  # shards, conformance) against an org-wide cap of five macOS runners.
  #
  # The group list comes from the binary itself (minus the oracle group),
  # regex-escaped, so a new group runs here without anyone editing this.
  macos-checks:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        timeout-minutes: 12
        uses: ./.github/actions/march-setup

      - name: Build compiler + property tests
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe test/test_properties.exe

      - name: Property tests (every group but the oracle)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          B=_build/default/test/test_properties.exe
          # Same group extraction as property-coverage. No MARCH_BIN: the
          # oracle group is excluded by the filter, not by a missing compiler.
          filter=$($B list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -E 's/[[:space:]]+[0-9]+[[:space:]]+.*$//' | sed -E 's/[[:space:]]+$//' \
            | grep -v '^$' | grep -v 'qcheck random seed' | sort -u \
            | grep -vxF 'oracle: interp = compiled' \
            | sed 's/[][\.*^$+?(){}|]/\\&/g' | paste -sd'|' -)
          [ -n "$filter" ] || { echo "::error::no property groups listed"; exit 1; }
          echo "filter: $filter"
          $B test "$filter" -e 2>&1 | tee /tmp/props.log
          ran=$(grep -cE '\[(OK|FAIL)\]' /tmp/props.log || true)
          echo "cases actually run: $ran"
          [ "$ran" -gt 0 ] || { echo "::error::the property filter matched no cases"; exit 1; }
          # Filtered-out cases still print as [SKIP]; only a case that RAN counts.
          if grep -qE '\[(OK|FAIL)\][[:space:]]+oracle: interp = compiled' /tmp/props.log; then
            echo "::error::the oracle group ran here; it belongs to property-oracle"; exit 1
          fi

      # See conformance's history of this step: a C threading benchmark whose
      # bound adapts to the runner's core count, so it is the one conformance
      # check whose answer depends on the OS.
      - name: Vault distinct-key read-scaling benchmark (not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @vault-scale
