# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  doc-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint docs for stale source pointers and stdlib counts
        run: scripts/check-docs.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            ocaml-compiler: 5.3.0
          - os: ubuntu-24.04
            ocaml-compiler: 5.3.0

    runs-on: ${{ matrix.os }}
    # Backstop for the dune-daemon wedge documented in CLAUDE.md/scripts/run-tests.sh
    # (a `dune build`/`dune runtest` invocation can hang indefinitely on its RPC
    # daemon, independent of what's being built/run — confirmed in CI: one run's
    # `Build` step, and another's `Test` step, each silently ate the full 6h GH
    # Actions job ceiling instead of failing fast). Per-step timeouts below give a
    # faster, more precise signal; this is the outer safety net.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        # v3.7.0 (2026-07) is the first setup-ocaml with a stable-opam release
        # entry for macos-15 (our minimum macOS target); the older @v3 the tag
        # resolved to failed with "no matching opam release", and forcing a
        # prerelease opam fails GPG verification. Pin the fixed version.
        uses: ocaml/setup-ocaml@v3.7.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install system dependencies
        run: |
          # z3: the refinement-type conformance corpus (@types-check) discharges
          # pre/postcondition + division-safety VCs via the `z3` binary on PATH
          # (lib/refine/solver.ml). Without it, refinement checks silently no-op
          # and the reject/t71-t73 witnesses stop being rejected. Install it on
          # both runners so the corpus is deterministic (macOS previously relied
          # on the runner image's pre-installed z3).
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install blake3 brotli zstd llvm z3
          else
            sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev z3
            # libblake3-dev is not available in Ubuntu 24.04; build from source
            git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
            cd /tmp/blake3/c
            gcc -O2 -shared -fPIC -o libblake3.so \
              blake3.c blake3_dispatch.c blake3_portable.c \
              blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
              blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
            sudo cp libblake3.so /usr/local/lib/libblake3.so
            sudo cp blake3.h /usr/local/include/blake3.h
            sudo ldconfig
          fi

      - name: Install dependencies
        timeout-minutes: 10
        run: opam install --deps-only --with-test -y .

      - name: Install zig (cross-compile driver for the linux/amd64 TLS+gzip test)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Fetch cross-compile sysroot cache (linux/amd64)
        run: scripts/fetch-cross-sysroot.sh amd64

      - name: Build
        timeout-minutes: 10
        run: |
          eval $(opam env)
          # Clear any stale daemon state before the first dune invocation of the
          # job (cheap defense-in-depth against the wedge below; likely a no-op on
          # a fresh GH-hosted runner, but mirrors scripts/run-tests.sh's
          # MARCH_DUNE_SHUTDOWN — belt-and-suspenders costs nothing here).
          dune shutdown 2>/dev/null || true
          # Build the public exe directly (bin/main.exe = `march`), NOT `@install`
          # (which also builds forge/march-lsp — neither is referenced anywhere
          # else in this job) and NOT a bare `dune build`. A no-target `dune build`
          # intermittently wedges at ~0% CPU AFTER building everything (a known
          # dune daemon hang, see CLAUDE.md/scripts/run-tests.sh) — even the
          # narrower `@install` alias hit this once in CI (a `Build` step silently
          # ate the full 6h job ceiling). A single explicit exe target is the
          # narrowest safe scope; the Test step (`dune runtest`) still builds+runs
          # the full test suite (incl. forge/lsp), so those compile errors are
          # still caught, just one step later.
          dune build bin/main.exe

      - name: Test
        timeout-minutes: 30
        run: |
          eval $(opam env)
          dune runtest

      - name: Static-semantics conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune build @types-check

      - name: Resolved-grammar conformance corpus (slow lane, not part of runtest)
        timeout-minutes: 5
        run: |
          eval $(opam env)
          dune build @grammar-check

      - name: Golden corpus AddressSanitizer gate (Linux only; RC/UAF guard)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          eval $(opam env)
          dune build bin/main.exe
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            ./specs/lang/golden/sanitize.sh

      - name: Check doc notebooks (.scrollmd) compile
        timeout-minutes: 5
        run: |
          eval $(opam env)
          MARCH_BIN="dune exec march --" python3 scripts/gen-scrollmd.py --check

      - name: Check formatting
        timeout-minutes: 3
        run: |
          eval $(opam env)
          dune fmt 2>&1 || true

  # Cross-compilation gate (P1): cross-compile the deterministic examples+golden
  # corpus to Linux via `zig cc` and assert byte-identical output to the native
  # build (native-referenced).  Targets linux/amd64 so the cross binaries run
  # NATIVELY on the x86_64 runner (no QEMU) — QEMU user-mode emulation produces
  # spurious segfaults that the oracle would count as failures.  arm64 coverage
  # needs a native arm64 runner (ubuntu-24.04-arm) — a follow-up.  This still
  # exercises the whole LinuxGnu / zig-cc / arch-flag / external-lib-stripping
  # path end to end.
  cross-linux-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.7.0
        with:
          ocaml-compiler: 5.3.0

      - name: Install system dependencies (blake3 for the native reference build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      - name: Install zig (the C cross-compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        timeout-minutes: 10
        run: opam install --deps-only --with-test -y .

      - name: Build compiler + oracle
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe test/test_oracle.exe

      - name: Cross oracle (linux/amd64, native-referenced, runs natively on the x86_64 runner)
        timeout-minutes: 20
        run: |
          eval $(opam env)
          MARCH_ORACLE_CROSS=amd64 \
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
          MARCH_ROOT="$PWD" \
          ./_build/default/test/test_oracle.exe

  # Differential-oracle CI (test/test_properties.ml's "oracle: interp = compiled"
  # group, ~1090 QCheck-generated compile-vs-interpret comparisons). This is NOT
  # wired into `dune runtest`'s Test step above: MARCH_BIN isn't set there, so all
  # 1090 checks silently skip today (confirmed identical across every historical
  # CI run — "no-march-binary", 0 matched). Wiring MARCH_BIN into that step
  # directly isn't viable either: each unique generated program is a real
  # `--compile` (no CAS cache hit across distinct sources — measured ~6.5s each
  # on GH Actions' own runners (slower than a local dev machine), dominated by
  # clang recompiling the whole C runtime from source every invocation), so all
  # 1090 would add well over an hour to the fast Test step on every push.
  # Instead this runs as its own job (parallel to the build matrix and
  # cross-linux-oracle above, like they already run concurrently), sharded
  # 8-way via alcotest's own case-number filtering (`test <suite> <cases>`),
  # hand-balanced by measured per-case cost (not a naive index range) so no
  # single shard is dominated by the two heavier cases (case 0 = println_arith
  # at QCheck count 100; case 20 = opt_matrix at count 20 * 2 opt levels).
  # Follow-up (deliberately not done here, bigger scope): precompiling the C
  # runtime once instead of per-`--compile` would cut every invocation to a
  # fraction of a second, making this whole job unnecessary — filed as a
  # separate compiler build-path improvement in specs/todos.md.
  property-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # 8-way (not 4-way): the first version of this job was sized against
        # local timing (~4s/compile on a 14-core Apple Silicon dev machine)
        # and failed on real GH Actions hardware, which measured ~6.5s/compile
        # (case 0 alone: 100 iterations in 10m48s) — shard 1 (250 cases) needed
        # ~27min against a 25min timeout. Re-balanced by measured cost so the
        # heaviest shard (150 cases) needs ~16min, comfortable margin under
        # the step timeout below.
        include:
          - shard: 1
            cases: "0,20"
          - shard: 2
            cases: "1,2,3"
          - shard: 3
            cases: "4,5,6"
          - shard: 4
            cases: "7,8,9"
          - shard: 5
            cases: "10,11,12"
          - shard: 6
            cases: "13,14,15"
          - shard: 7
            cases: "16,17"
          - shard: 8
            cases: "18,19"
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.7.0
        with:
          ocaml-compiler: 5.3.0

      - name: Install system dependencies (blake3 for the native build)
        run: |
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c \
            blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S \
            blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig

      - name: Install dependencies
        timeout-minutes: 10
        run: opam install --deps-only --with-test -y .

      - name: Build compiler + property-test binary
        timeout-minutes: 10
        run: |
          eval $(opam env)
          dune shutdown 2>/dev/null || true
          dune build bin/main.exe test/test_properties.exe

      - name: Differential oracle (shard ${{ matrix.shard }}/8, cases ${{ matrix.cases }})
        timeout-minutes: 25
        run: |
          eval $(opam env)
          MARCH_BIN="$PWD/_build/default/bin/main.exe" \
            ./_build/default/test/test_properties.exe test 'oracle: interp = compiled' "${{ matrix.cases }}" -e
