# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"
  # Rebuild an EXISTING release's archives with this branch's build.yml and
  # replace its assets in place (the release notes and the tag are untouched).
  # The tag push path builds with the tag commit's own build.yml, so a
  # packaging fix landed after a tag cannot reach that tag's archives any
  # other way. Added after v0.5.0 shipped archives without
  # runtime/third_party/.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and re-upload, e.g. v0.5.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}  # e.g. "v0.1.0"
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # First, before any artifact is downloaded or published: the pushed tag
      # must match the version compiled into the binaries.  forge resolves
      # `march = "~> X.Y"` and `.march-version` pins against release TAGS, so a
      # tag that disagrees with the artifacts makes forge's resolver lie.
      - name: Check tag matches in-tree version
        run: ./scripts/check-version-tag.sh "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The release body is this version's CHANGELOG section plus the install
      # blurb.  --max-bytes keeps it under GitHub's 125,000-character body cap
      # (the 0.3.0 section alone is 321KB); the script appends a pointer to the
      # full changelog when it truncates.
      - name: Build release notes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            ./scripts/changelog-section.sh --max-bytes 100000 "$VERSION"
            cat <<'BLURB'

          ## Installation

          ```
          curl -fsSL https://github.com/march-language/march/releases/latest/download/install.sh | sh
          ```

          Or if you already have forge:

          ```
          forge toolchain install TAGNAME
          forge toolchain use TAGNAME
          ```

          ## Checksums

          Verify your download:

          ```
          sha256sum -c march-TAGNAME-checksums.txt
          ```
          BLURB
          } | sed "s/TAGNAME/${GITHUB_REF_NAME}/g" > release-notes.md
          echo "release notes: $(wc -c < release-notes.md) bytes"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: March ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*
            install.sh
          draft: false
          prerelease: false

      # workflow_dispatch: the release already exists; replace its archives and
      # checksums (same names) and leave its notes, tag and `latest` alone.
      - name: Replace the existing release's assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          ls -l artifacts/
          gh release upload "$TAG" artifacts/* --clobber
          echo "replaced the assets of $TAG"

      - name: Update latest tag
        if: github.event_name == 'push'
        run: |
          git tag -f latest ${{ github.ref_name }}
          git push -f origin latest
