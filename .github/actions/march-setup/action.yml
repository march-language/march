name: march-setup
description: >
  One-stop toolchain setup for a March CI job: OCaml + cached opam
  dependencies, the C system libraries the runtime links against, and
  (optionally) the zig cross-compiler plus the linux/amd64 sysroot.

  Exists because the jobs below were split apart to run in parallel — every
  one of them needs the same ~30 lines of setup, and duplicating that across
  seven jobs is how the blake3/z3 dependency lists drift out of sync.
  Includes the pinned z3 (z3.version), on PATH.

inputs:
  ocaml-compiler:
    required: false
    default: "5.5.1"
    description: OCaml compiler version to install.
  cross-tools:
    required: false
    default: "false"
    description: >
      Also install zig and fetch the linux/amd64 cross sysroot. Needed by any
      job that cross-compiles: `dune runtest` (its linux/amd64 TLS+gzip test)
      and the cross oracle. Skipped elsewhere to save ~10s per job.

runs:
  using: composite
  steps:
    - name: Set up OCaml + install opam dependencies (cached)
      uses: ./.github/actions/opam-deps
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}

    - name: Install system dependencies
      shell: bash
      run: |
        # z3 is NOT installed from brew/apt: the step below puts the pinned
        # z3 (z3.version) on PATH, the same version every platform and every
        # release archive uses.
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install blake3 brotli zstd llvm
        else
          sudo apt-get install -y libbrotli-dev libzstd-dev llvm-dev
          # libblake3-dev is not available in Ubuntu 24.04; build from source
          git clone --depth 1 https://github.com/BLAKE3-team/BLAKE3.git /tmp/blake3
          cd /tmp/blake3/c
          # SIMD units are per-arch (see build.yml's Alpine leg): the arm64
          # runner the refine-agreement job uses needs NEON, not the x86 units.
          case "$(uname -m)" in
            aarch64) B3_SIMD="blake3_neon.c" ;;
            *)       B3_SIMD="blake3_sse2_x86-64_unix.S blake3_sse41_x86-64_unix.S blake3_avx2_x86-64_unix.S blake3_avx512_x86-64_unix.S" ;;
          esac
          gcc -O2 -shared -fPIC -o libblake3.so \
            blake3.c blake3_dispatch.c blake3_portable.c $B3_SIMD
          sudo cp libblake3.so /usr/local/lib/libblake3.so
          sudo cp blake3.h /usr/local/include/blake3.h
          sudo ldconfig
        fi

    # The pinned z3 (z3.version), built from source by scripts/install-z3.sh
    # and cached per platform, version and recipe.  The refinement corpus
    # (@types-check), the refinecheck suite and the verdict-agreement job all
    # discharge their VCs with it; a distro z3 (Ubuntu's apt has 4.8.12)
    # proves different things and warns solver_version_mismatch.
    - name: Restore the pinned z3
      id: z3-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/march-z3
        key: z3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('z3.version', 'scripts/install-z3.sh') }}

    - name: Build the pinned z3 (cache miss only) and put it on PATH
      shell: bash
      run: |
        scripts/install-z3.sh "$HOME/.cache/march-z3"
        echo "$HOME/.cache/march-z3" >> "$GITHUB_PATH"

    - name: Save the pinned z3
      if: steps.z3-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/march-z3
        key: ${{ steps.z3-cache.outputs.cache-primary-key }}

    - name: Install zig (the C cross-compiler)
      if: inputs.cross-tools == 'true'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.2

    - name: Fetch cross-compile sysroot cache (linux/amd64)
      if: inputs.cross-tools == 'true'
      shell: bash
      run: scripts/fetch-cross-sysroot.sh amd64
