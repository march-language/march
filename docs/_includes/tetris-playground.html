<style>
  .tp-wrap { display: flex; gap: 2rem; margin: 2rem 0; align-items: flex-start; flex-wrap: wrap; }
  .tp-editor-col { flex: 1 1 480px; min-width: 320px; }
  .tp-editor {
    width: 100%;
    height: 480px;
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    resize: vertical;
  }
  .tp-run-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .tp-run-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 4px;
    padding: 6px 16px;
    font-family: inherit;
    cursor: pointer;
  }
  .tp-run-btn:hover { border-color: var(--accent); }
  .tp-errors {
    white-space: pre-wrap;
    color: #f87171;
    font-family: monospace;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  .tp-errors.visible { display: block; }
  .tp-game-col { flex: 1 1 340px; min-width: 300px; }
  .tp-iframe-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #1a1a2e;
  }
  #tp-iframe-host { width: 100%; height: 560px; border: 0; display: block; }
</style>

<div class="tp-wrap" id="tp-wrap" data-base="{{ site.baseurl }}" data-ver="{{ site.time | date: '%s' }}">
  <div class="tp-editor-col">
    <textarea class="tp-editor" id="tp-editor" spellcheck="false"></textarea>
    <div class="tp-run-row">
      <button class="tp-run-btn" onclick="tpRun()">Run &#9654;</button>
      <span id="tp-status" style="color: var(--text-faint); font-size: 12px;"></span>
    </div>
    <div class="tp-errors" id="tp-errors"></div>
  </div>
  <div class="tp-game-col">
    <div class="tp-iframe-wrap"><div id="tp-iframe-host"></div></div>
  </div>
</div>

<script src="{{ site.baseurl }}/assets/tetris-playground.js?v={{ site.time | date: '%s' }}"></script>
