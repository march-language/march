<svg xmlns="http://www.w3.org/2000/svg" width="459" height="418" viewBox="0 0 459 418" role="img" aria-label="The Order protocol, line by line"><style>.mx-ink{fill:#cce5f5}.mx-dim{fill:#3f6f94}.mx-line{stroke:#3f6f94;stroke-width:1;fill:none}.mx-label{fill:#6b9bbe;font:12px system-ui,-apple-system,sans-serif}.mx-label-strong{fill:#cce5f5;font:600 13px system-ui,-apple-system,sans-serif}.mx-mono{font-family:ui-monospace,Menlo,monospace}.mx-srcline{fill:#cce5f5}.mx-state{fill:#ff6b5e}.mx-fn{fill:#3f6f94}.mx-changed{fill:#ff6b5e}.mx-cell{fill:none;stroke:#3f6f94;stroke-width:1}.mx-lit{fill:#cce5f5;stroke:#cce5f5}.mx-wrong{fill:#ff6b5e;stroke:#ff6b5e}.mx-ping{fill:none;stroke:#6b9bbe;stroke-width:1}.mx-failed{stroke:#ff6b5e;stroke-width:2}.mx-accent-text{fill:#ff6b5e}.mx-host{fill:none;stroke:#cce5f5;stroke-width:1}.mx-seg{fill:none;stroke:#3f6f94;stroke-width:1}.mx-done{fill:#0f2438}.mx-next{stroke:#ff6b5e;stroke-width:2}.mx-codeline{fill:#cce5f5;font-family:ui-monospace,Menlo,monospace;white-space:pre}.mx-off{fill:#3f6f94}.mx-hl{fill:#cce5f5}.mx-hlbar{fill:#ff6b5e}</style><rect width="100%" height="100%" fill="#07101a"/><g transform="translate(14 14)"><text class="mx-codeline" x="13" y="21" font-size="15">@[endpoints]</text><text class="mx-codeline" x="13" y="45" font-size="15">protocol Order do</text><text class="mx-codeline" x="31" y="69" font-size="15">role Stock needs IO.Mut</text><text class="mx-codeline" x="31" y="93" font-size="15">role Ledger needs IO.Console</text><text class="mx-codeline" x="31" y="117" font-size="15">loop do</text><text class="mx-codeline" x="49" y="141" font-size="15">want: Shop -&gt; Stock : Int</text><text class="mx-codeline" x="49" y="165" font-size="15">choose by Stock:</text><text class="mx-codeline" x="67" y="189" font-size="15">have -&gt; Stock -&gt; Shop : String</text><text class="mx-codeline" x="139" y="213" font-size="15">book: Stock -&gt; Ledger : Int</text><text class="mx-codeline" x="139" y="237" font-size="15">booked: Ledger -&gt; Shop : String</text><text class="mx-codeline" x="67" y="261" font-size="15">out  -&gt; Stock -&gt; Shop : String</text><text class="mx-codeline" x="139" y="285" font-size="15">skip: Stock -&gt; Ledger : Int</text><text class="mx-codeline" x="139" y="309" font-size="15">stop</text><text class="mx-codeline" x="49" y="333" font-size="15">end</text><text class="mx-codeline" x="31" y="357" font-size="15">end</text><text class="mx-codeline" x="13" y="381" font-size="15">end</text></g></svg>
