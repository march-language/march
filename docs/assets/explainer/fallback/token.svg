<svg xmlns="http://www.w3.org/2000/svg" width="708" height="200" viewBox="0 0 708 200" role="img" aria-label="The linear value t, line by line: where it is bound, where it is used"><style>.mx-ink{fill:#cce5f5}.mx-dim{fill:#3f6f94}.mx-line{stroke:#3f6f94;stroke-width:1;fill:none}.mx-label{fill:#6b9bbe;font:12px system-ui,-apple-system,sans-serif}.mx-label-strong{fill:#cce5f5;font:600 13px system-ui,-apple-system,sans-serif}.mx-mono{font-family:ui-monospace,Menlo,monospace}.mx-srcline{fill:#cce5f5}.mx-state{fill:#ff6b5e}.mx-fn{fill:#3f6f94}.mx-changed{fill:#ff6b5e}.mx-cell{fill:none;stroke:#3f6f94;stroke-width:1}.mx-lit{fill:#cce5f5;stroke:#cce5f5}.mx-wrong{fill:#ff6b5e;stroke:#ff6b5e}.mx-ping{fill:none;stroke:#6b9bbe;stroke-width:1}.mx-failed{stroke:#ff6b5e;stroke-width:2}.mx-accent-text{fill:#ff6b5e}.mx-host{fill:none;stroke:#cce5f5;stroke-width:1}.mx-seg{fill:none;stroke:#3f6f94;stroke-width:1}.mx-done{fill:#0f2438}.mx-next{stroke:#ff6b5e;stroke-width:2}.mx-codeline{fill:#cce5f5;font-family:ui-monospace,Menlo,monospace;white-space:pre}.mx-off{fill:#3f6f94}.mx-hl{fill:#cce5f5}.mx-hlbar{fill:#ff6b5e}.mx-token{fill:#cce5f5;stroke:#cce5f5;stroke-width:1.5}.mx-spent{fill:none}.mx-token.mx-hot{fill:#ff6b5e;stroke:#ff6b5e}.mx-token.mx-dim{fill:none;stroke:#3f6f94}.mx-held{}.mx-token-text{fill:#07101a;font-family:ui-monospace,Menlo,monospace;font-weight:700}.mx-token-text.mx-hollow{fill:#cce5f5}.mx-token-note{fill:#6b9bbe}.mx-bar{fill:#cce5f5}.mx-bar.mx-over{fill:#ff6b5e}.mx-bar.mx-made{fill:#3f6f94}.mx-bar.mx-ghost{fill:#3f6f94;opacity:0.45}.mx-ghost-text{opacity:0.7}.mx-contract{stroke:#cce5f5;stroke-width:1.5}.mx-contract.mx-design{stroke:#3f6f94;stroke-dasharray:3 3}.mx-contract-text{fill:#cce5f5}</style><rect width="100%" height="100%" fill="#07101a"/><g transform="translate(14 14)"><rect class="mx-hlbar" x="30" y="75" width="3" height="24"/><text class="mx-codeline mx-off" x="34" y="21" font-size="14">fn main() : Int do</text><text class="mx-codeline" x="50.8" y="45" font-size="14">linear let t : Tree = Node(Leaf(1), Node(Leaf(2), Leaf(3)))</text><text class="mx-codeline" x="50.8" y="69" font-size="14">let t2 = inc_leaves(t)</text><text class="mx-codeline" x="50.8" y="93" font-size="14">sum_leaves(t2) - sum_leaves(t)</text><text class="mx-codeline mx-off" x="34" y="117" font-size="14">end</text><circle class="mx-token mx-held" cx="16" cy="40" r="8"/><text class="mx-token-text" x="16" y="44.2" text-anchor="middle" font-size="11">t</text><text class="mx-label mx-token-note" x="556.4" y="45">exactly once</text><circle class="mx-token mx-spent" cx="16" cy="64" r="8"/><text class="mx-token-text mx-hollow" x="16" y="68.2" text-anchor="middle" font-size="11">t</text><circle class="mx-token mx-hot" cx="16" cy="88" r="8"/><text class="mx-token-text" x="16" y="92.2" text-anchor="middle" font-size="11">t</text><text class="mx-label mx-accent-text" x="312.8" y="93">used again</text><text class="mx-label mx-mono mx-accent-text" x="34" y="141">[linear_used_twice]</text></g></svg>
