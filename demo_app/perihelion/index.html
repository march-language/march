<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perihelion — March</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: #eee;
      position: relative;
    }
    h1 {
      position: fixed;
      top: 0.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #8892b0;
      pointer-events: none;
      z-index: 1;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }
    .hint {
      position: fixed;
      bottom: 0.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #4a5568;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>PERIHELION</h1>
  <canvas id="game-canvas"></canvas>
  <p class="hint">tap to release · chain the stars · Compiled from March with --target js</p>
  <script type="module" src="perihelion.mjs"></script>
</body>
</html>
